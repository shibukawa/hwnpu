    from: hf:google/magenta-realtime-2@010aa0dcb0dfd27b24f0ad07b4dad63e8f9521cc
    machine: 8
    memory: 1.0
    bytes: 1.7e9
    about: "Magenta RealTime 2 small (230M): 48 kHz stereo music from a text of its style (MusicCoCa), 25 frames a second; weights CC-BY 4.0"
  MOSS-SoundEffect-v2.0:
    family: moss-soundeffect
    tag: v2.0
    kind: sfx
    # OpenMOSS's MOSS-SoundEffect v2.0 (code and weights Apache-2.0): Qwen3-1.7B reads the
    # prompt, a 1.3B Wan DiT denoises, the DAC VAE decodes; hwnpu-audio runs it. The machine
    # picks the text encoder's format (sfx.Formats): fp16 here, lut8 with 5 layers in fp16 in
    # the -lut8 one (moss-soundeffect:8g)
    from: hf:OpenMOSS-Team/MOSS-SoundEffect-v2.0@e35df4d82fbe87fcd5d14e5d100e349c0c3c076d
    machine: 16
    memory: 2.3
    bytes: 1.15e10
    about: "MOSS-SoundEffect v2.0 (1.3B DiT, Qwen3-1.7B text encoder in fp16, DAC VAE): up to 30 s of 48 kHz mono sound effects from a text; Apache-2.0"
  MOSS-SoundEffect-v2.0-lut8:
    like: MOSS-SoundEffect-v2.0
    tag: v2.0-lut8
    machine: 8
    memory: 2.2
    about: "MOSS-SoundEffect v2.0 with the text encoder in lut8 (5 of its 28 layers in fp16) for 8 GB: up to 30 s of 48 kHz mono sound effects from a text; Apache-2.0"

  # hwnpu-image generate: on AMD's NPU the export ~/models/NAME.amd-npu2 (or NAME-1024.amd-npu2,
  # in lower case) of tools/amd/iron_anima.py or iron_sana.py; on Apple's NPU Anima and Sana, on
  # Intel's Anima, are downloaded and converted on their first run
  Anima-Turbo:
    family: anima-turbo
    tag: v1.1
    kind: image
    from: hf:circlestone-labs/Anima
    file: anima-turbo-v1.1.safetensors
    machine: 8
    # AMD: the NPU's 2.4 GiB peak (the VAE's stages) and the process's 0.9 GiB, measured
    memory: {amd: 3.5, apple: 4.1}
    bytes: 5.9e9
    about: "Anima-Turbo (Cosmos-Predict2 2B, Qwen3-0.6B): 1024x1024 in 8 steps, Danbooru tags and natural language"
  Anima-Aesthetic:
    family: anima
    tag: aesthetic
    kind: image
    from: hf:circlestone-labs/Anima
    file: anima-aesthetic-v1.1.safetensors
    machine: 8
    memory: {amd: 3.5, apple: 4.1}
    bytes: 5.9e9
    about: "Anima-Aesthetic v1.1: Anima tuned on high-quality pictures, 30 steps with classifier-free guidance (--guidance, --negative), about 6.5 times Anima-Turbo's time"
  Anima-Base:
    like: Anima-Aesthetic
    tag: base
    file: anima-base-v1.0.safetensors
    # named as anima:base: the family alone picks Anima-Aesthetic
    machine: 0
    about: "Anima-Base v1.0: the pretrained model, the most varied and plain in style (the one LoRAs are trained on), 30 steps with classifier-free guidance"
  Sana-600M:
    family: sana
    tag: 0.6b
    kind: image
    from: hf:Efficient-Large-Model/Sana_600M_1024px_diffusers
    machine: 8
    memory: {amd: 2.3, apple: 3.3}
    bytes: 8.9e9
    about: "NVlabs' Sana 600M (Gemma 2 2B reads the prompt): 20 steps with classifier-free guidance (--guidance, --negative), English prompts; AMD's and Apple's NPU"
  SANA1.5-1.6B:
    family: sana
    tag: 1.6b
    kind: image
    from: hf:Efficient-Large-Model/SANA1.5_1.6B_1024px_diffusers
    machine: 16
    memory: {amd: 2.3, apple: 3.1}
    bytes: 9.7e9
    about: "SANA 1.5 1.6B: nearer the prompt than 600M, 20 steps with classifier-free guidance; AMD's and Apple's NPU"
  # hwnpu-image depth: on AMD's NPU the export ~/models/NAME.amd-npu2 (lower case) of
  # tools/amd/iron_da3.py or iron_moge.py; on Apple's NPU the checkpoint is downloaded and each size
  # converted when a picture first takes it
  DA3MONO-LARGE:
    family: da3
    tag: mono-large
