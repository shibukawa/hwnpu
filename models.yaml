# The models hwnpu knows, and the models each use recommends on a machine of each memory
# (MODEL.md's table). hwnpu embeds this file; a file of your own adds to it and overrides it:
# ~/.config/hwnpu/models.yaml (%LOCALAPPDATA%\hwnpu\models.yaml on Windows), HWNPU_MODELS, or
# --models FILE (hwnpu-chat; -models for the others). Write only what changes there. The design is docs/model-table.md.
#
# models: NAME: what -m (hwnpu-chat, hwnpu-image), -use (the others) and the API call it.
#   family, tag   FAMILY:TAG picks it (plamo3translate:2b); the family alone picks the tag of the
#                 largest machine up to this machine's memory
#   kind          chat, embedding (hwnpu-chat: chat, agent, search, serve), transcribe (hwnpu-audio transcribe),
#                 speech (hwnpu-audio tts), decision (hwnpu-chat systemone), image, depth, face-detect (hwnpu-image),
#                 pitch (hwnpu-audio pitch), pose (hwnpu-image pose), notes (hwnpu-audio notes), music, sfx (hwnpu-audio generate),
#                 label (hwnpu-image label, embed)
#   device        where it runs by the NPU's vendor (amd, apple, intel): npu (the default) or cpu;
#                 a command's --device and HWNPU_DEVICE override it
#   from          hf:OWNER/NAME (a Hugging Face repository), hf:OWNER/NAME@REVISION to pin one.
#                 Models of one repository share its download (NAME's directory). It is looked for
#                 in the sources first (HWNPU_MODEL_SOURCE, _1, ...: docs/cache-sharing-design.md 7)
#   targets       the version of what is converted for each target ({coreai: {version: 1}}),
#                 bumped by hand when what is made changes: the sources keep it as vN (v0-HASH
#                 with no version). amd-xdna2's is model-recipes.yaml's (models.NAME.amd.version);
#                 a file of your own may give it over that
#   exports       the conversions pinned, by target and export: "FOLDER sha256:DIGEST", the folder of the
#                 entry in a source (converted/MODEL/TARGET/EXPORT/FOLDER, the same path in the model's
#                 repository on Hugging Face) and the digest of its files (their paths, sizes and SHA-256).
#                 Taken from that folder whatever tools made it, and only with that digest; what is
#                 made here instead goes beside it as v0-HASH; none (a file of your own) drops the
#                 pin. hwnpu-dev models pin writes them (docs/prebuilt.md 5.3)
#   develop       true: in development; what is converted goes in the sources as vN-HASH
#   hub           the model's conversions on Hugging Face, by repository: the commit each target
#                 reads there ({hwnpu/NAME: {amd-xdna2: COMMIT, apple: COMMIT}}; coreai-ARCH before
#                 apple on a Mac of that Neural Engine). hwnpu-dev models hf push writes it (docs/prebuilt.md)
#   arch          the structure, one of hwnpu-dev convert -archs (default: from config.json)
#   license       the weights' license: {id, url, class, terms, accept}. class is what it allows of
#                 commercial use: open, conditional (a cap of revenue, a registration) or
#                 non-commercial (the weights, even when what they make may be sold); accept asks
#                 the user once before the first run. Every model has one (docs/model-provenance.md)
#   content       what it may make unasked that the model policy refuses unless allowed: [nsfw]
#                 (HWNPU_MODEL_ALLOWLIST=+nsfw)
#   sha256        FILE: the SHA-256 of a file of the repository, checked from any source; a file
#                 another model pins with the same SHA-256 and has downloaded is linked from its
#                 directory instead of downloaded (Qwen3-1.7B and MOSS-SoundEffect's text encoder)
#   machine       the least memory of a machine, in GB, the family recommends the model for: one
#                 number, or a table by the NPU's vendor where they differ (machine: {apple: 16, amd: 8});
#                 a vendor it leaves out takes the largest, and variants must be above the least
#   memory        what the model takes running, in GB (MODEL.md, "at start"): the peak of the NPU's
#                 buffers and the process's together over a run (docs/design/new-model-checklist.md)
#   bytes         the size of the download (the files preparation fetches, GB of 10^9 bytes)
#   disk          what the model keeps in the cache to run (its conversion unpacked and its tables;
#                 not the checkpoint, which only converting reads), GB, a table by vendor; a vendor
#                 it leaves out is not known. hwnpu-dev models hf sizes --write models.yaml writes it from
#                 what the sources hold (Core AI's: at its version). Preparing takes bytes and disk
#                 at once for a while (a packed export is unpacked beside its pack)
#                 memory and bytes take one number, or a table by the NPU's vendor where they
#                 differ (memory: {amd: 3.5, apple: 4.1}); a vendor the table leaves out takes its
#                 largest. The table may name Apple's chips too (M1, M2, ...), where one differs
#                 from the others (memory: {amd: 2.2, apple: 3.1, M1: 1.7})
#   features      what it can do besides its kind (hwnpu-chat list explains them)
#   no_think      answers without thinking unless asked (its chat template's own default)
#   prefill, format, context, paged, tier
#                 how hwnpu-chat runs a chat model when its flags (--prefill, --format, --context,
#                 --paged, --tier) do not say: auto, on or off; a weight format (lut8); tokens; a
#                 chunk of tokens or -1; auto, none or a list of caches
#   variants      the model on machines of more memory than machine, by the least memory in GB:
#                 each changes the memory and the five above that it gives, on machines of that
#                 much or more (variants: {16: {memory: 2.3, prefill: auto}}); a file of your own
#                 changes the variants it names. How the exports for AMD's NPU are made (of a
#                 variant too) is in model-recipes.yaml (docs/model-recipes.md)
#   not_on        chips (M1, M2, M3, M4, M5; an M1 Pro is an M1) a family or a use does not pick
#                 the model on: the family's next is picked there (the 2B for PLaMo 3 Translate
#                 8B on an M1); its name and FAMILY:TAG still run it
#   like          another model whose fields this one takes, except its tag
#   remove        true: drop the model
# categories: NAME: a use (-m translate). picks are MODEL.md's columns: the model a machine of
#   that much memory (GB) or more runs. A file of your own replaces a column's model, or drops it
#   with remove: true.
# aliases: NAME: OTHER runs OTHER wherever NAME is picked (a use, a family's tag, -m or -use, a request).
# policy: [ITEM, ...] (a file of your own only) the model policy, before HWNPU_MODEL_ALLOWLIST's
#   items (comma separated): -license:ID or -license:CLASS refuses, +license:... allows only what
#   it names, +nsfw allows the models of content nsfw. A - wins. A use picks the next model
#   allowed; a model named is refused with why (docs/model-provenance.md 2)
version: 1

# hub: push: the namespace on Hugging Face hwnpu-dev models hf push puts the conversions in (PUSH/MODEL);
#   a file of your own gives another (an account or an organization of yours)
hub:
  push: hwnpu

