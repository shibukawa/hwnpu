      vae/diffusion_pytorch_model.safetensors: ca70d2202afe6415bdbcb8793ba8cd99fd159cfe6192381504d6c4d3036e0f04
    machine: 8
    # AMD: the peak of a 1024 x 1024 run, 3.43 GiB on the NPU (the VAE's stages, which share their
    # buffers; the text encoder's layers and the DiT's blocks are read a group at a time into one
    # bank) and the process's 0.16 GiB, measured; an edit with one reference peaks the same
    # (docs/design/image-amd.md to docs/design/image-amd.md). 1.9 GB at 512 x 512.
    # Apple: the peak of the process's footprint and its Neural Engine footprint together at
    # 1024 x 1024 on an M1, 4.9 GB (in the VAE's stages: 3.8 GiB of the process and 0.8 GiB on the
    # Neural Engine; 3.1 GB at 512 x 512), measured (docs/design/image-apple.md, docs/design/image-models.md)
    memory: {amd: 3.9, apple: 4.9}
    # AMD: the export for the NPU as the sources hold it (packed, files.tar.zst). Apple: the
    # export of the eight sizes and the edits below, one for every chip but the M1
    # (flux.2-klein-4b-8sizes-4d02f40a-5edits-cacbebeb-lut8-lut8-v6.coreai; an M1's, of its own
    # edits below, is ...-5edits-624c2d9e-..., the same size), and the chip's
    # prebuilt programs (0.3 GB on an M3 at v5). Converting here fetches the repository's
    # diffusers layout instead (16 GB; not its single-file DiT)
    bytes: {amd: 12.50e9, apple: 7.97e9}
    features: [edit]
    # The NPU exports: each vendor's weight formats and picture sizes. The sizes are the default on
    # every generation of the vendor's NPU, and a generation that a bigger one does better
    # overrides them under generations (a chip on Apple, xdna1 or xdna2 on AMD). The default is what
    # was checked on the lowest machine. Apple: the Neural Engine on an M1 (2026-11-17 and
    # 2026-11-18), lut8 for the text encoder and the DiT, which it computes exactly (the default).
    # AMD: the export of all eight (2026-11-18).
    npu:
      apple:
        formats: {text: lut8, dit: lut8}
        sizes:
          "1:1": 1024x1024
          "1:1s": 512x512
          "2:3": 768x1152
          "3:4": 768x1024
          "9:16": 704x1280
          "3:2": 1152x768
          "4:3": 1024x768
          "16:9": 1280x704
        # the edits in the same export, functions of the same DiT programs (the weights once,
        # prebuilt): a picture of 1024 x 1024 from one reference of 1024 (8704 keys) or two or three
        # of 512 (6656, 7680), as many references as AMD's take; one of 512 x 512 from one or two of
        # 512 (the VAE's encoder at 1024 and 512). A reference of 1024 beside others (9728 keys or
        # more) failed coreai-build's single blocks (flux2klein.PrebuiltKeys), so none is here: the
        # device compiled them for hours at the first such edit (2026-11-24)
        edits:
          "1:1": ["1", "2@half", "3@half"]
          "1:1s": ["1", "2"]
        # An M1 reads the one reference of a picture of 1024 x 1024 at 512 (5632 keys), so that
        # its export holds no function of 8192 keys or more: coreai-build's h13g program of the
        # edit from a reference of 1024 (8704 keys) is wrong on the M1 (two single blocks against
        # the CPU: cosine -0.0005, 37924 values not finite; the double blocks' crash the service
        # that finishes them), and Core AI then compiles the whole program on the device (54 min
        # for one of 13). The same function compiled on the M1 is right, as coreai-build's of 4608
        # and 6656 keys are (docs/known-issues.md 13, 2026-11-25). One export still, of its own
        # name; --image FILE takes the reference at half the sides by itself
        generation_edits:
          M1:
            "1:1": ["1@half", "2@half", "3@half"]
      amd:
        sizes:
          "1:1": 1024x1024
          "1:1s": 512x512
          "2:3": 832x1248
          "3:4": 880x1168
          "9:16": 768x1344
          "3:2": 1248x832
          "4:3": 1168x880
          "16:9": 1344x768
        # the references an edit takes at these sizes when hwnpu-image's --image names no size
        # (FILE@half): npu.apple's edits, so that one call draws one picture on both (keep the two
        # the same). The export runs more (tools/amd/iron_flux2klein.py: every mix of up to 4 of
        # 12800 rows or less), named by --image FILE@half; another number here is refused, as on
        # Apple's (2026-11-24). The other sizes take any number of the picture's size
        edits:
          "1:1": ["1", "2@half", "3@half"]
          "1:1s": ["1", "2"]
    about: "FLUX.2 klein 4B (a 3.9B DiT of FLUX's shape, Qwen3-4B reads the prompt, the FLUX.2 VAE): 4 steps without guidance, and edits or composes from reference images (--image; on Apple's Neural Engine at 1024 x 1024 and 512 x 512, in the same export); AMD's NPU (about 29 s at 1024 x 1024, an edit from one reference 1 min, from two or three (of 512) 47 to 56 s) and Apple's Neural Engine (text to image: about 41 s at 1024 x 1024, 11 s at 512 x 512 on an M1); Apache-2.0"
