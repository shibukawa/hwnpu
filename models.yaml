# The models hwnpu knows, and the models each use recommends on a machine of each memory
# (MODEL.md's table). hwnpu embeds this file; a file of your own adds to it and overrides it:
# ~/.config/hwnpu/models.yaml (%LOCALAPPDATA%\hwnpu\models.yaml on Windows), HWNPU_MODELS, or
# --models FILE (hwnpu-chat; -models for the others). Write only what changes there. The design is docs/model-table.md.
#
# models: NAME: what -m (hwnpu-chat, hwnpu-image), -use (the others) and the API call it.
#   family, tag   FAMILY:TAG picks it (plamo3translate:2b); the family alone picks the tag of the
#                 largest machine up to this machine's memory
#   kind          chat, embedding (hwnpu-chat: chat, agent, search, serve), transcribe (hwnpu-audio transcribe),
#                 speech (hwnpu-audio tts), decision (hwnpu-chat systemone), image, depth, face-detect (hwnpu-image),
#                 pitch (hwnpu-audio pitch), pose (hwnpu-image pose), notes (hwnpu-audio notes), music, sfx (hwnpu-audio generate),
#                 label (hwnpu-image label, embed)
#   device        where it runs by the NPU's vendor (amd, apple, intel): npu (the default) or cpu;
#                 a command's --device and HWNPU_DEVICE override it
#   from          hf:OWNER/NAME (a Hugging Face repository), hf:OWNER/NAME@REVISION to pin one.
#                 Models of one repository share its download (NAME's directory)
#   arch          the structure, one of hwnpu-dev convert -archs (default: from config.json)
#   sha256        FILE: the SHA-256 of a file of the repository, checked from any source; a file
#                 another model pins with the same SHA-256 and has downloaded is linked from its
#                 directory instead of downloaded (Qwen3-1.7B and MOSS-SoundEffect's text encoder)
#   machine       the least memory of a machine, in GB, the family recommends the model for
#   memory        what the model takes running, in GB (MODEL.md, "at start"): the peak of the NPU's
#                 buffers and the process's together over a run (docs/new-model-checklist.md 11.2)
#   bytes         the size of the download (the files preparation fetches, GB of 10^9 bytes)
#                 memory and bytes take one number, or a table by the NPU's vendor where they
#                 differ (memory: {amd: 3.5, apple: 4.1}); a vendor the table leaves out takes its
#                 largest
#   features      what it can do besides its kind (hwnpu-chat list explains them)
#   no_think      answers without thinking unless asked (its chat template's own default)
#   prefill, format, context, paged
#                 how hwnpu-chat runs a chat model when its flags (--prefill, --format, --context,
#                 --paged) do not say: auto, on or off; a weight format (lut8); tokens; a chunk of
#                 tokens or -1
#   variants      the model on machines of more memory than machine, by the least memory in GB:
#                 each changes the memory and the four above that it gives, on machines of that
#                 much or more (variants: {16: {memory: 7.6, prefill: auto}}); a file of your own
#                 changes the variants it names
#   amd_export    how tools/amd/iron_export_lm.py exports it for AMD's NPU: its model and options.
#                 Without an export here (~/models/NAME.amd-npu2, with -q4 or -q6 for --q4 and
#                 --mlp q6), the first run downloads the checkpoint and runs it in IRON's
#                 environment (HWNPU_IRON_ENV, INSTALL_AMD.md); a model without it has no form there
#   not_on        chips (M1, M2, M3, M4, M5; an M1 Pro is an M1) a family or a use does not pick
#                 the model on: the family's next is picked there (the 2B for PLaMo 3 Translate
#                 8B on an M1); its name and FAMILY:TAG still run it
#   like          another model whose fields this one takes, except its tag
#   remove        true: drop the model
# categories: NAME: a use (-m translate). picks are MODEL.md's columns: the model a machine of
#   that much memory (GB) or more runs. A file of your own replaces a column's model, or drops it
#   with remove: true.
# aliases: NAME: OTHER runs OTHER wherever NAME is picked (a use, a family's tag, -m or -use, a request).
version: 1

models:
  LFM3-1.7B:
    family: lfm3
    tag: 1.7b
    kind: chat
    from: hf:LiquidAI/LFM3-1.7B
    machine: 8
    memory: 2.2
    bytes: 3.5e9
    features: [tools, thinking]
    amd_export: lfm3 --max-seq-len 12288 --q4
    about: "Liquid AI's 1.7B model, text only, in 6 bit tables: small and fast enough to run behind an agent such as OpenCode"
  LFM3-VL-2B:
    family: lfm3-vl
    tag: 2b
    kind: chat
    from: hf:LiquidAI/LFM3-VL-2B
    machine: 8
    memory: 2.6
    bytes: 3.8e9
    features: [tools, thinking, vision]
    amd_export: lfm3vl --max-seq-len 12288 --q4
    about: "Liquid AI's LFM3 with a vision encoder: its text model in 8 bit tables, images of 512x512"
  LFM3-Audio-2B:
    family: lfm3-audio
    tag: 2b
    kind: chat
    from: hf:LiquidAI/LFM3-Audio-2B
    machine: 8
    memory: 2.6
    bytes: 4.0e9
    features: [tools, thinking, audio]
    amd_export: lfm3audio --max-seq-len 12288 --q4
    about: "Liquid AI's LFM3 with an audio encoder: its text model in 8 bit tables, clips up to 30 seconds; answers are text (speech: hwnpu-audio tts)"
  LFM3-Omni-2B:
    family: lfm3-omni
    tag: 2b
    kind: chat
    from: hf:LiquidAI/LFM3-Omni-2B
    machine: 8
    memory: 3.0
    bytes: 4.3e9
    features: [tools, thinking, vision, audio]
    amd_export: lfm3omni --max-seq-len 12288 --q4
    about: "Liquid AI's LFM3 with both encoders: images of 512x512 and clips up to 30 seconds, answers in text"
  gemma-4-E2B-it:
    family: gemma4
    tag: e2b
    kind: chat
    from: hf:google/gemma-4-E2B-it
    machine: 8
    memory: 2.3
    bytes: 10.2e9
    features: [tools, thinking]
    amd_export: gemma4 --max-seq-len 4096 --q4
    about: "Google's Gemma 4 E2B, instruction tuned: its text model in 6 bit tables (the download has the vision and audio parts too, which are not converted)"
  gemma-4-E4B-it:
    family: gemma4
    tag: e4b
    kind: chat
    from: hf:google/gemma-4-E4B-it
    machine: 24
    memory: 4.0
    bytes: 16.0e9
    features: [tools, thinking]
    amd_export: gemma4 --max-seq-len 4096 --q4
    about: "Google's Gemma 4 E4B, instruction tuned: larger and slower than E2B, its text model in 6 bit tables (vision and audio not converted)"
  Qwen3.5-4B:
    family: qwen3.5
    tag: 4b
    kind: chat
    from: hf:Qwen/Qwen3.5-4B
    machine: 24
    memory: 4.2
    bytes: 9.3e9
    features: [tools, thinking]
    amd_export: qwen35 --max-seq-len 4096 --q4
    about: "Qwen's Qwen3.5-4B: strong at code for its size, its text model in 8 bit tables (6 bit ones lose too much) read 8 tokens per call; the download has the vision part too, which is not converted"
  Qwen3.5-0.8B:
    family: qwen3.5
    tag: 0.8b
    kind: chat
    from: hf:Qwen/Qwen3.5-0.8B
    machine: 8
    memory: 2.6
    bytes: 1.77e9
    features: [tools, thinking]
    no_think: true
    amd_export: qwen35 --max-seq-len 4096 --q4 --mlp q6 --head q6 --verify 3
    about: "Qwen's smallest Qwen3.5, the 4B's structure in 0.8B: fast, but weak at facts; its text model in 8 bit tables, answering without thinking unless asked; the download has the vision part too, which is not converted"
  Qwen3.5-2B:
    family: qwen3.5
    tag: 2b
    kind: chat
    from: hf:Qwen/Qwen3.5-2B
    machine: 16
    memory: 4.2
    bytes: 4.57e9
    features: [tools, thinking]
    no_think: true
    amd_export: qwen35 --max-seq-len 4096 --q4 --mlp q6 --head q6 --verify 3
    about: "Qwen's Qwen3.5-2B, the 4B's structure in 2B: its text model in 6 bit tables (as good as 8 bit ones on it), answering without thinking unless asked; the download has the vision part too, which is not converted"
  Qwen3-0.6B:
    family: qwen3
    tag: 0.6b
    kind: chat
    from: hf:Qwen/Qwen3-0.6B
    machine: 8
    memory: 3.9
    bytes: 1.52e9
    features: [tools, thinking]
    about: "Qwen's smallest Qwen3, a plain dense model of 0.6B: small to download, but weak at facts and with a context of 4096 (-paged 1024 for 32768, slower); in 8 bit tables, tool calls as JSON"
  Qwen3-1.7B:
    # the same checkpoint (byte for byte) as MOSS-SoundEffect v2.0's text encoder: the files of
    # the same sha256 are linked from one's download into the other's (fetch)
    family: qwen3
    tag: 1.7b
    kind: chat
    from: hf:Qwen/Qwen3-1.7B@70d244cc86ccca08cf5af4e1e306ecf908b1ad5e
    sha256:
      model-00001-of-00002.safetensors: 169ad53ec313c3a34b06c0809216e4fc072cce444a5d4ff2b59690d064130ed5
      model-00002-of-00002.safetensors: 912becff8d60672aa8628ef08c05898d9adf17c2ad4ae3caf99b065622fdeff9
    # M3: on 8 GB one program reads the prompts too, 1.63 GiB on the Neural Engine and the
    # process's 2.2 to 2.8 GB at its peak while loading (1.0 to 1.6 GB answering); a new prompt
    # of 1822 tokens in 16.8 s. From 16 GB a program of its own reads them (3.4 s): two of
    # 1.63 GiB and the process's 3.0 to 4.1 GB at its peak (1.5 to 2.1 GB answering)
    machine: 8
    memory: 4.5
    prefill: off
    variants:
      16: {memory: 7.6, prefill: auto}
    bytes: 4.06e9
    features: [tools, thinking]
    about: "Qwen3-1.7B, the 0.6B's structure in 1.7B (byte for byte the text encoder of MOSS-SoundEffect): weak at Japanese facts as the 0.6B is; a context of 4096 (-paged 1024 for 32768, slower), in 8 bit tables, tool calls as JSON; below 16 GB one program, slower to read long prompts"
  plamo-3-translate-8b:
    # the 2B's structure in 8B (hidden 4096, 32 layers, 4 key and value heads). Apple: 4 bit
    # tables (the architecture's Format for the 8B), 3.81 GiB on the Neural Engine and the
    # process's 4.1 GB at its peak (M1), one program. Not picked on an M1, over the 2.8 GiB its
    # Neural Engine runs at full speed (0.8 tokens/s; the 2B instead); an M2 9 to 10 tokens/s
    # (35 to 41 s every start, its compile cache keeping part), an M3 10 to 11 (4 s). AMD: q4 (the MLP and output matrix q4nx, attention
    # q8), estimated from the weights, not run. Intel: int4 by rows (Config.IntelFormat) in one
    # program (prefill off; the Neural Engine has one anyway), 3.8 GiB under the about 4.6 GB a
    # Core Ultra 5 135U's NPU held, where int8's 7.6 would not fit; not run, its precision not
    # checked (docs/design.md 16.143, 16.164)
    family: plamo3translate
    tag: 8b
    kind: chat
    from: hf:pfnet/plamo-3-translate-8b@cc265d585980c39436db5b9c136cd6644f446807
    # the shards' sha256 as Hugging Face's API gives them, checked against the download (M1)
    sha256:
      model-00001-of-00004.safetensors: 2bb697527d3003a96b699366c186e23efecf9af03d882cb2697290213a69a4c3
      model-00002-of-00004.safetensors: 08ae648fc9834efd79266032e797bbc361113dc02d65006d6b49ef18387d2ef3
      model-00003-of-00004.safetensors: 23ec2db0f3aae7982e50d20d7cd600e6d27bde217e4a761a1915196bc9cffc41
      model-00004-of-00004.safetensors: 1bad10b23b66c221c4fb04106315faf6b6d401f9e2d72cb78947063cac1ceb77
    machine: 16
    not_on: [M1]
    memory: {amd: 6.5, apple: 8.2}
    prefill: off
    bytes: 17.07e9
    features: [translation]
    amd_export: plamo3 --max-seq-len 8192 --q4
    about: "Preferred Networks' PLaMo 3 Translate 8B: the 2B's translation from a model 3.5 times as large, in 4 bit tables (as good as 8 bit ones on it); 10 to 11 tokens/s on an M3; not picked on an M1 (its 3.8 GiB is over what an M1's Neural Engine runs at full speed: the 2B there); on Intel's NPU in int4, its precision not checked yet"
  plamo-3-translate-2b:
    family: plamo3translate
    tag: 2b
    kind: chat
    from: hf:pfnet/plamo-3-translate-2b
    machine: 16
    memory: 2.7
    bytes: 5.76e9
    features: [translation]
    amd_export: plamo3 --max-seq-len 8192 --q4
    about: "Preferred Networks' PLaMo 3 Translate 2B: translation between Japanese, English and other languages, in 8 bit tables; the earlier texts and translations of a conversation are its history"
  plamo-3-translate-0.8b:
    family: plamo3translate
    tag: 0.8b
    kind: chat
    from: hf:pfnet/plamo-3-translate-0.8b
    machine: 8
    memory: 2.4
    bytes: 1.79e9
    features: [translation]
    amd_export: plamo3 --max-seq-len 8192 --q4
    about: "Preferred Networks' PLaMo 3 Translate 0.8B: the 2B's translation in a third of the memory, for small machines, in 8 bit tables"
  plamo-embedding-1b:
    family: plamo-embedding
    tag: 1b
    kind: embedding
    from: hf:pfnet/plamo-embedding-1b
    machine: 8
    memory: 1.3
    bytes: 2.1e9
    features: [query]
    about: "Preferred Networks' Japanese sentence embeddings (2048 dimensions): search, clustering, classification"
  whisper-large-v3-turbo:
    family: whisper
    tag: large-v3-turbo
    kind: transcribe
    from: hf:openai/whisper-large-v3-turbo
    machine: 8
    memory: 1.9
    bytes: 1.6e9
    about: "OpenAI's Whisper large-v3-turbo: transcription of 99 languages, with timestamps, in 8 bit tables"
  LFM3-Audio-2B-TTS:
    family: lfm3-audio-tts
    tag: 2b
    kind: speech
    from: hf:LiquidAI/LFM3-Audio-2B
    machine: 8
    memory: 2.4
    bytes: 4.0e9
    about: "LFM3-Audio-2B speaking a text (24 kHz WAV): its text model in 8 bit tables, the depthformer and the codec decoder in fp16; shares LFM3-Audio-2B's download"
  d1-2B:
    family: d1
    tag: 2b
    kind: decision
    from: hf:LiquidAI/d1-2B
    machine: 8
    memory: 2.4
    about: "Liquid AI's d1-2B: answers typed questions about a state (the System One API), images too, in 8 bit tables"
  d1-Omni-2B:
    family: d1-omni
    tag: 2b
    kind: decision
    from: hf:LiquidAI/d1-Omni-2B
    machine: 8
    memory: 2.8
    about: "Liquid AI's d1-Omni-2B: d1 with an audio encoder, questions about images and clips and questions asked as a clip"
  swift-f0:
    family: swiftf0
    tag: "0.3"
    kind: pitch
    # lars76/swift-f0 0.3.0's swift_f0/model.onnx (MIT), byte for byte (sha256), from a mirror on
    # Hugging Face: the project publishes it on GitHub and PyPI only
    from: hf:aaatmy/swift-f0-onnx@7877fbaad8ea5dbe0fac0edc4b2703cbea381c14
    sha256: {model.onnx: 6385e8c2ebc3872e82c9ff5946228de44cd3be77a750ea53698b7dbfe94b0a22}
    machine: 8
    memory: 0.06
    bytes: 1.4e5
    about: "SwiftF0 0.3.0: the pitch of one voice or instrument every 16 ms, from 47 to 2094 Hz, with a voicing confidence; 14K parameters"
  RTMO-s:
    family: rtmo
    tag: s
    kind: pose
    # OpenMMLab MMPose's RTMO-s (Apache-2.0), the ONNX export Transformers.js reads
    from: hf:Xenova/RTMO-s@d8c526187f341d287753831c9c8b1ecc4855bba1
    sha256: {onnx/model.onnx: 1cd6a3517658903233e9ccb78666554862f57f0944b6886e2048093594aef4e7}
    # AMD's NPU: an export of tools/amd/iron_onnxcnn.py (its transformer layer included, at
    # HIGH), made on the first run; the people and keypoints of ONNX Runtime's within 2 px
    # (docs/amd-npu-models.md 22)
    device: {amd: npu}
    machine: 8
    # AMD: 327 MiB pinned on the NPU and 215 MiB of the process (the ONNX graph for the host's part)
    memory: {amd: 0.55, apple: 0.23}
    bytes: 4.0e7
    about: "RTMO-s: the people in an image and their 17 COCO keypoints in one pass, without a person detector; 9.9M parameters, images stretched to 640x640"
  # hwnpu-image detect: OpenMMLab MMDetection's RTMDet (Apache-2.0), MMDeploy's ONNX exports of
  # its COCO weights in one repository; sha256 names the model's file
  RTMDet-tiny:
    family: rtmdet
    tag: tiny
    kind: detect
    from: hf:bukuroo/RTMDet-ONNX@aa91dbccc283db36b2c250a1d91ba9518db553da
    sha256: {rtmdet-tiny-coco.onnx: f25bab7abb4ccfba4f785b90e8bc1bf1dec432e8878a9ecef9a79e3f6f9a62a5}
    # AMD's NPU (tools/amd/iron_onnxcnn.py) holds RTMDet-m's objects, but tiny's and s's BN-folded
    # weights and biases cancel to outputs 50 times smaller, past MEDIUM's bfp16 (A and B) and the
    # GEMM's SiLU (vtanh): their scores moved by up to 0.2 and s lost objects; at HIGH tiny is
    # slower than the CPU (docs/amd-npu-models.md 21.4). The CPU there
    device: {amd: cpu}
    machine: 8
    # M1: a footprint of 56 MB and 11 MB on the Neural Engine; 7 ms a picture
    memory: 0.07
    bytes: 2.2e7
    about: "RTMDet-tiny: the objects in an image, boxes and COCO's 80 labels (41.1 box AP); 4.8M parameters, images fit into 640x640"
  RTMDet-s:
    like: RTMDet-tiny
    tag: s
    sha256: {rtmdet-s-coco.onnx: 22de7e20d483e69b1ed202beafe1d237b0e1d99d7ddb7c3d4895fb1036c3384d}
    machine: 8
    # M1: 73 MB and 21 MB on the Neural Engine; 9 ms a picture
    memory: 0.1
    bytes: 4.0e7
    about: "RTMDet-s: the objects in an image, boxes and COCO's 80 labels (44.6 box AP); 8.9M parameters, images fit into 640x640"
  RTMDet-m:
    like: RTMDet-tiny
    tag: m
    sha256: {rtmdet-m-coco.onnx: 07921f4ee8c477b00abfce3c3bfff53bbc528c41abfa0193f981afbafcff95d4}
    # AMD's NPU: exported with IRON on the first run (~/models/rtmdet-m.amd-npu2), 0.33 s and 1.9 J
    # a picture where the CPU (ONNX Runtime, 1 thread, balanced) takes 0.54 s and 8 to 11 J
    device: {amd: npu}
    machine: 16
    # M1: 141 MB and 56 MB on the Neural Engine; 18 ms a picture. AMD: 565 MiB on the NPU, 98 MiB
    # the process
    memory: {amd: 0.7, apple: 0.2}
    bytes: 1.1e8
    about: "RTMDet-m: the objects in an image, boxes and COCO's 80 labels (49.1 box AP); 24.7M parameters, images fit into 640x640"
  # hwnpu-image ocr: PaddleOCR's PP-OCRv6 (Apache-2.0), the ONNX files PaddlePaddle publishes: the
  # recognizer's repository, and the detector's in with (its files' sha256 under detector/)
  PP-OCRv6-small:
    family: ppocr
    tag: small
    kind: ocr
    from: hf:PaddlePaddle/PP-OCRv6_small_rec_onnx@b8f84f0b80c529de40b4fbb3544b84fa7233a513
    with: {detector: "hf:PaddlePaddle/PP-OCRv6_small_det_onnx@28fe5895c24fd108c19eb3e8479f4ab385fbfc62"}
    sha256:
      inference.onnx: 5435fd747c9e0efe15a96d0b378d5bd157e9492ed8fd80edf08f30d02fa24634
      inference.yml: ab078671bb49f06228eadccd34f1bb501e157f7a047095ffb943ba81512c77d1
      detector/inference.onnx: d73e0058b7a8086bbd57f3d10b8bcd4ff95363f67e06e2762b5e814fe9c9410e
      detector/inference.yml: 193f435274bf9f0b5f71a929bbfbcf148282df7e633b34e7c373e8f44741b516
    machine: 8
    # M1: a footprint of 425 MB at most (the recognizer's programs of seven widths and their
    # outputs, 12 to 24 MB each); a page of 98 lines in 0.5 s
    memory: 0.45
    bytes: 3.1e7
    about: "PP-OCRv6 small: the lines of text in an image and what they say, 50 languages (Japanese, Chinese, English, ...); 5.2M parameters"
  basic-pitch:
    family: basic-pitch
    tag: icassp2022
    kind: notes
    # spotify/basic-pitch's basic_pitch/saved_models/icassp_2022/nmp.onnx (Apache-2.0), byte for
    # byte (sha256), from a mirror on Hugging Face: Spotify's repository there holds no weights
    from: hf:AEmotionStudio/basic-pitch-onnx-models@327fd8ccd2f0bb84cbe56b4a0e9d318398ddf763
    sha256: {nmp.onnx: 2c3c1d144bfa61ad236e92e169c13535c880469a12a047d4e73451f2c059a0ec}
    machine: 8
    memory: 0.07
    bytes: 2.3e5
    about: "Spotify's Basic Pitch: the notes of any instrument, several at once, with pitch bends, written as MIDI; 36K parameters"
  magenta-realtime-2-small:
    family: magenta-realtime-2
    tag: small
    kind: music
    # Google DeepMind's Magenta RealTime 2 (code Apache-2.0, weights CC-BY 4.0: credit "Magenta
    # RealTime 2 by Google DeepMind" where the music is used)
    from: hf:google/magenta-realtime-2@010aa0dcb0dfd27b24f0ad07b4dad63e8f9521cc
    machine: 8
    memory: 1.0
    bytes: 1.7e9
    about: "Magenta RealTime 2 small (230M): 48 kHz stereo music from a text of its style (MusicCoCa), 25 frames a second; weights CC-BY 4.0"
  MOSS-SoundEffect-v2.0:
    family: moss-soundeffect
    tag: v2.0
    kind: sfx
    # OpenMOSS's MOSS-SoundEffect v2.0 (code and weights Apache-2.0): Qwen3-1.7B reads the
    # prompt, a 1.3B Wan DiT denoises, the DAC VAE decodes; hwnpu-audio runs it. The machine
    # picks the text encoder's format (sfx.Formats): fp16 here, lut8 with 5 layers in fp16 in
    # the -lut8 one (moss-soundeffect:8g)
    from: hf:OpenMOSS-Team/MOSS-SoundEffect-v2.0@e35df4d82fbe87fcd5d14e5d100e349c0c3c076d
    # the text encoder is Qwen3-1.7B's checkpoint: linked from its download when it is here
    sha256:
      text_encoder/model-00001-of-00002.safetensors: 169ad53ec313c3a34b06c0809216e4fc072cce444a5d4ff2b59690d064130ed5
      text_encoder/model-00002-of-00002.safetensors: 912becff8d60672aa8628ef08c05898d9adf17c2ad4ae3caf99b065622fdeff9
    machine: 16
    memory: 2.3
    bytes: 1.15e10
    about: "MOSS-SoundEffect v2.0 (1.3B DiT, Qwen3-1.7B text encoder in fp16, DAC VAE): up to 30 s of 48 kHz mono sound effects from a text; Apache-2.0"
  MOSS-SoundEffect-v2.0-lut8:
    like: MOSS-SoundEffect-v2.0
    tag: v2.0-lut8
    machine: 8
    memory: 2.2
