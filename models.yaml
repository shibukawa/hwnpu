categories:
  chat:
    aliases: [code, agent]
    about: chat and coding, with tool calls
    picks:
      - {machine: 8, model: LFM3-1.7B}
      - {machine: 16, model: gemma-4-E2B-it}
      - {machine: 24, model: gemma-4-E4B-it}
  vision:
    about: reads images (image generation is another use)
    picks:
      - {machine: 8, model: LFM3-VL-2B}
  audio:
    about: reads audio, questions about it (transcription is transcribe)
    picks:
      - {machine: 8, model: LFM3-Audio-2B}
      - {machine: 16, model: LFM3-Omni-2B}
  translate:
    aliases: [translation]
    about: translation
    picks:
      - {machine: 8, model: plamo-3-translate-0.8b}
      - {machine: 16, model: plamo-3-translate-8b}
  embedding:
    aliases: [embed, search]
    about: sentence embeddings, search
    picks:
      - {machine: 8, model: plamo-embedding-1b}
  transcribe:
    aliases: [transcription, asr]
    about: speech to text (hwnpu-audio transcribe)
    picks:
      - {machine: 8, model: whisper-large-v3-turbo}
  speech:
    aliases: [tts]
    about: text to speech (hwnpu-audio tts)
    picks:
      - {machine: 8, model: LFM3-Audio-2B-TTS}
  decision:
    aliases: [systemone]
    about: typed questions about a state (hwnpu-chat systemone)
    picks:
      - {machine: 8, model: d1-2B}
  image:
    aliases: [generate]
    about: image generation (hwnpu-image generate)
    # FLUX.2 klein from 8 GB (4.9 GB on Apple at 1024 x 1024, 41 s on an M1; 3.9 GB on AMD):
    # Apache-2.0, safe by default, and edits too on AMD. Anima and Chroma (nsfw) are not picked
    # even with +nsfw: named, they run (docs/design/image-models.md)
    picks:
      - {machine: 8, model: FLUX.2-klein-4B}
  depth:
    about: depth estimation (hwnpu-image depth)
    picks:
      - {machine: 8, model: DA3-SMALL}
      - {machine: 16, model: DA3-BASE}
      - {machine: 24, model: DA3MONO-LARGE}
  face-detect:
    about: face detection (hwnpu-image face-detect)
    picks:
      - {machine: 8, model: YuNet}
  pitch:
    aliases: [f0]
    about: the pitch (F0) of a voice or an instrument (hwnpu-audio pitch)
    picks:
      - {machine: 8, model: swift-f0}
  pose:
    aliases: [keypoints]
    about: people and their 17 keypoints in an image (hwnpu-image pose)
    picks:
      - {machine: 8, model: RTMO-s}
  detect:
    aliases: [object-detect, objects]
    about: the objects in an image, boxes and labels (hwnpu-image detect)
    picks:
      - {machine: 8, model: RTMDet-s}
      - {machine: 16, model: RTMDet-m}
  ocr:
    aliases: [text]
    about: the text in an image, its lines and boxes (hwnpu-image ocr)
    picks:
      - {machine: 8, model: PP-OCRv6-small}
  label:
    aliases: [labels, classify, zero-shot, image-embedding]
    about: labels of an image from any candidates, embeddings of images and texts (hwnpu-image label, embed)
    picks:
      - {machine: 8, model: siglip2-base-patch16-224}
      - {machine: 16, model: siglip2-large-patch16-256}
  segment:
    aliases: [sam, cutout-point]
    about: the mask of the thing a point or a box picks in a picture (hwnpu-image segment)
    picks:
      - {machine: 8, model: EfficientSAM-Ti}
      - {machine: 16, model: EfficientSAM-S}
  notes:
    aliases: [midi]
    about: the notes of music, as MIDI (hwnpu-audio notes)
    picks:
      - {machine: 8, model: basic-pitch}
  music:
    aliases: [music-generation]
    about: music from a text of its style (hwnpu-audio generate)
    picks:
      - {machine: 8, model: magenta-realtime-2-small}
  sfx:
    aliases: [sound-effects, sound-effect]
    about: sound effects from a text (hwnpu-audio generate)
    picks:
      - {machine: 8, model: MOSS-SoundEffect-v2.0-lut8}
      - {machine: 16, model: MOSS-SoundEffect-v2.0}
