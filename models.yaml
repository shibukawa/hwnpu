      transformer/diffusion_pytorch_model-00002-of-00002.safetensors: 6f6217ab2c7ce5ef177ec202f79d4c2ddab78111c4645030c8828ec615d5f02c
      # the DiT's single-file copy (BFL's names), which AMD's exporter reads (iron_flux3klein.py)
      model.safetensors: c3e9813cdd049c831c836b2e9db61150e49a93fc1a4c63b256494642fee0bd7c
      text_encoder/model-00001-of-00002.safetensors: 30a01a0556622645a3cce87b655bbbbbc1f170c196099f1b666c93202c3339a9
      text_encoder/model-00002-of-00002.safetensors: 046296a2a387efb43b0c997d5833c789604d168834f6e0d3064bf7bb13d002a6
      text_encoder/tokenizer.json: a5d85b6dcc535e6b93115a9ef287e6132fdbf30270da6218194ba742261173c7
      vae/diffusion_pytorch_model.safetensors: d64f3a68e1cc4f9f4e29b6e0da38a0204fe9a49f2d4053f0ec1fa1ca02f9c4b5
    machine: 16
    # Apple: the process's footprint at 1024 x 1024 peaks at 4.1 GB (M3, measured); the Neural
    # Engine's own is not measured yet (the DiT's programs a group at a time, 0.6 GB each at lut8):
    # an estimate (docs/design/image-apple.md). AMD: the NPU's drm-total-memory and RssAnon + RssShmem peak at
    # 3.6 GiB at 1024 x 1024 (2.5 GiB at 512 x 512), measured (docs/design/image-amd.md)
    memory: {amd: 3.9, apple: 5.5}
    # AMD: the export of all eight (one export, tools/amd/iron_flux3klein.py; 2026-11-18): the
    # image's rows are padded to whole rounds of 512, so every size but 512 x 512 runs 1024 x
    # 1024's graphs but the single blocks (docs/design/image-amd.md). FLUX.2 klein's sizes on AMD
    npu:
      amd:
        sizes:
          "1:1": 1024x1024
          "1:1s": 512x512
          "2:3": 832x1248
          "3:4": 880x1168
          "9:16": 768x1344
          "3:2": 1248x832
          "4:3": 1168x880
          "16:9": 1344x768
    # the repository's diffusers layout (not its single-file copy of the DiT nor its fp8 and nvfp4
    # variants)
    # AMD: the export for the NPU as the sources hold it (packed, files.tar.zst)
    bytes: {amd: 13.76e9, apple: 2.03e10}
    about: "FLUX.3 klein (a 5.5B DiT with each stream's mode blocks then single blocks, Qwen3-VL-4B reads the prompt, the FLUX.2 VAE): 16 flow-map steps without guidance, text to image on AMD's NPU (about 1 min 45 s at 1024 x 1024, 32 s at 512 x 512) and Apple's Neural Engine (lut8 tables fitted to the activations; about 2 min at 1024 x 1024 on an M3); FLUX Kommunity License (not commercial)"
