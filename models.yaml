# The models hwnpu knows, and the models each use recommends on a machine of each memory
# (MODEL.md's table). hwnpu embeds this file; a file of your own adds to it and overrides it:
# ~/.config/hwnpu/models.yaml (%LOCALAPPDATA%\hwnpu\models.yaml on Windows), HWNPU_MODELS, or
# --models FILE (hwnpu-chat; -models for the others). Write only what changes there. The design is docs/model-table.md.
#
# models: NAME: what -m (hwnpu-chat, hwnpu-image), -use (the others) and the API call it.
#   family, tag   FAMILY:TAG picks it (plamo3translate:2b); the family alone picks the tag of the
#                 largest machine up to this machine's memory
#   kind          chat, embedding (hwnpu-chat: chat, agent, search, serve), transcribe (hwnpu-audio transcribe),
#                 speech (hwnpu-audio tts), decision (hwnpu-chat systemone), image, depth, face-detect (hwnpu-image),
#                 pitch (hwnpu-audio pitch), pose (hwnpu-image pose), notes (hwnpu-audio notes), music, sfx (hwnpu-audio generate),
#                 label (hwnpu-image label, embed)
#   device        where it runs by the NPU's vendor (amd, apple, intel): npu (the default) or cpu;
#                 a command's --device and HWNPU_DEVICE override it
#   from          hf:OWNER/NAME (a Hugging Face repository), hf:OWNER/NAME@REVISION to pin one.
#                 Models of one repository share its download (NAME's directory). It is looked for
#                 in the sources first (HWNPU_MODEL_SOURCE, _1, ...: docs/cache-sharing-design.md 7)
#   targets       the version of what is converted for each target ({amd-xdna2: {version: 2},
#                 coreai: {version: 1}}), bumped by hand when what is made changes: the sources
#                 keep it as vN (v0-HASH with no version)
#   develop       true: in development; what is converted goes in the sources as vN-HASH
#   arch          the structure, one of hwnpu-dev convert -archs (default: from config.json)
#   license       the weights' license: {id, url, class, terms, accept}. class is what it allows of
#                 commercial use: open, conditional (a cap of revenue, a registration) or
#                 non-commercial (the weights, even when what they make may be sold); accept asks
#                 the user once before the first run. Every model has one (docs/model-provenance.md)
#   content       what it may make unasked that the model policy refuses unless allowed: [nsfw]
#                 (HWNPU_MODEL_ALLOWLIST=+nsfw)
#   sha256        FILE: the SHA-256 of a file of the repository, checked from any source; a file
#                 another model pins with the same SHA-256 and has downloaded is linked from its
#                 directory instead of downloaded (Qwen3-1.7B and MOSS-SoundEffect's text encoder)
#   machine       the least memory of a machine, in GB, the family recommends the model for
#   memory        what the model takes running, in GB (MODEL.md, "at start"): the peak of the NPU's
#                 buffers and the process's together over a run (docs/design/new-model-checklist.md)
#   bytes         the size of the download (the files preparation fetches, GB of 10^9 bytes)
#                 memory and bytes take one number, or a table by the NPU's vendor where they
#                 differ (memory: {amd: 3.5, apple: 4.1}); a vendor the table leaves out takes its
#                 largest. The table may name Apple's chips too (M1, M2, ...), where one differs
#                 from the others (memory: {amd: 2.2, apple: 3.1, M1: 1.7})
#   features      what it can do besides its kind (hwnpu-chat list explains them)
#   no_think      answers without thinking unless asked (its chat template's own default)
#   prefill, format, context, paged, tier
#                 how hwnpu-chat runs a chat model when its flags (--prefill, --format, --context,
#                 --paged, --tier) do not say: auto, on or off; a weight format (lut8); tokens; a
#                 chunk of tokens or -1; auto, none or a list of caches
#   variants      the model on machines of more memory than machine, by the least memory in GB:
#                 each changes the memory, the five above and amd_export that it gives, on
#                 machines of that much or more (variants: {16: {memory: 2.3, prefill: auto}});
#                 a file of your own changes the variants it names
#   amd_export    how tools/amd/iron_export_lm.py exports it for AMD's NPU: its model and options.
#                 Without an export here (~/models/NAME.amd-npu2, with -q4 or -q6 for --q4 and
#                 --mlp q6, then -pN for --expert-places N), the first run downloads the
#                 checkpoint and runs it in IRON's environment (HWNPU_IRON_ENV, INSTALL_AMD.md); a
#                 model without it has no form there
#   not_on        chips (M1, M2, M3, M4, M5; an M1 Pro is an M1) a family or a use does not pick
#                 the model on: the family's next is picked there (the 2B for PLaMo 3 Translate
#                 8B on an M1); its name and FAMILY:TAG still run it
#   like          another model whose fields this one takes, except its tag
#   remove        true: drop the model
# categories: NAME: a use (-m translate). picks are MODEL.md's columns: the model a machine of
#   that much memory (GB) or more runs. A file of your own replaces a column's model, or drops it
#   with remove: true.
# aliases: NAME: OTHER runs OTHER wherever NAME is picked (a use, a family's tag, -m or -use, a request).
# policy: [ITEM, ...] (a file of your own only) the model policy, before HWNPU_MODEL_ALLOWLIST's
#   items (comma separated): -license:ID or -license:CLASS refuses, +license:... allows only what
#   it names, +nsfw allows the models of content nsfw. A - wins. A use picks the next model
#   allowed; a model named is refused with why (docs/model-provenance.md 2)
version: 1

models:
  LFM3-1.7B:
    family: lfm3
    tag: 1.7b
    kind: chat
    from: hf:LiquidAI/LFM3-1.7B
    license: {id: lfm-open-1.0, url: "https://huggingface.co/LiquidAI/LFM3-1.7B/blob/main/LICENSE", class: conditional, terms: "commercial use only below 10 million US dollars of annual revenue (the whole group)"}
    # Apple (Core AI, measured on an M1, 2026-11-15, docs/design/memory-and-power.md): the programs split
    # at the attention hold the weights once, 1.36 GiB on the Neural Engine and the process's
    # 0.23 GiB, 1.7 GB. The whole program of short conversations (docs/design/apple-coreai.md) holds them once more,
    # 2.64 + 0.21 GiB, 3.1 GB (an M1 made to load it, --tier 2048): over what a machine of 8 GB
    # has for models, so none there (tier: none; --tier auto has it, docs/design/memory-and-power.md), and from 16 GB on
    # an M2 or later (an M1 never loads it, docs/design/apple-coreai.md)
    machine: 8
    memory: {amd: 2.2, apple: 1.7}
    tier: none
    variants:
      16: {memory: {apple: 3.1, M1: 1.7}, tier: auto}
    bytes: {amd: 1.74e9, apple: 3.5e9}
    features: [tools, thinking]
    amd_export: lfm3 --max-seq-len 12288 --q4
    about: "Liquid AI's 1.7B model, text only, in 6 bit tables: small and fast enough to run behind an agent such as OpenCode"
  LFM2-8B-A1B:
    # a mixture of experts (lfm2_moe, 32 experts of which 4 a token): the host picks the experts
    # between the parts and a program without weights runs them, every layer's experts held in
    # int8 (docs/handoff-ane-gather.md 1b). Apple only, Core AI: an M3 (2026-11-19) 15.0-16.1
    # tokens/s, 1503 tokens of prompt in 8.6-10.9 s; an M2 12.0-13.7 tokens/s, 1624 in 13-14.5 s,
    # loaded in 3.1 s and 8.0 GB (the experts' 7.23 GiB in the process's memory; the first run,
    # converting, 12.9 GB). Short of memory the system compresses the experts and a prompt takes
    # up to 3 times as long: HWNPU_MOE_WIRE=1 wires them. Not on an M1: its Neural Engine does
    # not take the gather_nd that picks the experts' scales. Not picked by a use: 8.0 GB on 16 GB
    family: lfm2
    tag: 8b-a1b
    kind: chat
    from: hf:LiquidAI/LFM2-8B-A1B@7ed1404fdf502a5446c1b67d4fe1533158d6f2ad
    license: {id: lfm-open-1.0, url: "https://huggingface.co/LiquidAI/LFM2-8B-A1B/blob/main/LICENSE", class: conditional, terms: "commercial use only below 10 million US dollars of annual revenue (the whole group)"}
    machine: 16
    memory: 8.0
    bytes: 16.7e9
    features: [tools]
    not_on: [M1]
    about: "Liquid AI's LFM2-8B-A1B, a mixture of experts of 8.3B with 1.5B active a token: the experts in int8, the rest in 8 bit tables; a context of 128000, tool calls in Python's form; Apple's M2 and later only"
  LFM3-VL-2B:
    family: lfm3-vl
    tag: 2b
    kind: chat
    from: hf:LiquidAI/LFM3-VL-2B
    license: {id: lfm-open-1.0, url: "https://huggingface.co/LiquidAI/LFM3-VL-2B/blob/main/LICENSE", class: conditional, terms: "commercial use only below 10 million US dollars of annual revenue (the whole group)"}
    # Apple (Core AI, an M1, 2026-11-15, docs/design/memory-and-power.md): 2.24 GiB on the Neural Engine and the process's
    # 0.25 GiB describing a picture; 2.14 + 0.23 GiB (2.6 GB) with text alone, the vision
    # encoder loaded from the start
    machine: 8
    memory: {amd: 2.6, apple: 2.7}
    bytes: {amd: 2.08e9, apple: 3.8e9}
    features: [tools, thinking, vision]
    amd_export: lfm3vl --max-seq-len 12288 --q4
    about: "Liquid AI's LFM3 with a vision encoder: its text model in 8 bit tables, images of 512x512"
  LFM3-Audio-2B:
    family: lfm3-audio
    tag: 2b
    kind: chat
    from: hf:LiquidAI/LFM3-Audio-2B
    license: {id: lfm-open-1.0, url: "https://huggingface.co/LiquidAI/LFM3-Audio-2B/blob/main/LICENSE", class: conditional, terms: "commercial use only below 10 million US dollars of annual revenue (the whole group)"}
    # Apple (Core AI, an M1, 2026-11-15, docs/design/memory-and-power.md): 2.18 GiB on the Neural Engine and the process's
    # 0.21 GiB answering about a clip (2.6 GB); 2.05 + 0.23 GiB (2.4 GB) with text alone
    machine: 8
    memory: 2.6
    bytes: {amd: 1.97e9, apple: 4.0e9}
    features: [tools, thinking, audio]
    amd_export: lfm3audio --max-seq-len 12288 --q4
    about: "Liquid AI's LFM3 with an audio encoder: its text model in 8 bit tables, clips up to 30 seconds; answers are text (speech: hwnpu-audio tts)"
  LFM3-Omni-2B:
    family: lfm3-omni
    tag: 2b
    kind: chat
    from: hf:LiquidAI/LFM3-Omni-2B
    license: {id: lfm-open-1.0, url: "https://huggingface.co/LiquidAI/LFM3-Omni-2B/blob/main/LICENSE", class: conditional, terms: "commercial use only below 10 million US dollars of annual revenue (the whole group)"}
    # Apple (Core AI, an M1, 2026-11-15, docs/design/memory-and-power.md): 2.63 GiB on the Neural Engine and the process's
    # 0.25 GiB with a picture and a clip; 2.40 + 0.23 GiB (2.8 GB) with text alone, both
    # encoders loaded from the start
    machine: 8
    memory: {amd: 3.0, apple: 3.1}
    bytes: {amd: 2.33e9, apple: 4.3e9}
    features: [tools, thinking, vision, audio]
    amd_export: lfm3omni --max-seq-len 12288 --q4
    about: "Liquid AI's LFM3 with both encoders: images of 512x512 and clips up to 30 seconds, answers in text"
  gemma-4-E2B-it:
    family: gemma4
    tag: e2b
    kind: chat
    from: hf:google/gemma-4-E2B-it
    license: {id: apache-2.0, url: "https://ai.google.dev/gemma/docs/gemma_4_license", class: open}
    machine: 8
    # AMD (2026-11-17, docs/design/performance.md): the peak of a chat, 1.76 GiB on the NPU and
    # the process's 0.45 GiB; the download is the converted export (5.09 GB, its per-layer
    # embedding table in int8), packed to 4.78 GB. Apple (an M2, 2026-11-17): the converted Core AI
    # export (1.73 GB) and the tables (3.17 GB, the per-layer embeddings in int8), 4.94 GB with the tokenizer
    memory: {amd: 2.4, apple: 2.3}
    bytes: {amd: 4.78e9, apple: 4.9e9}
    features: [tools, thinking]
    amd_export: gemma4 --max-seq-len 4096 --q4
    about: "Google's Gemma 4 E2B, instruction tuned: its text model in 6 bit tables (the download has the vision and audio parts too, which are not converted)"
  gemma-4-E4B-it:
    family: gemma4
    tag: e4b
    kind: chat
    from: hf:google/gemma-4-E4B-it
    license: {id: apache-2.0, url: "https://ai.google.dev/gemma/docs/gemma_4_license", class: open}
    machine: 24
    # AMD (2026-11-17, docs/design/performance.md): the peak of a chat, 3.55 GiB on the NPU and
    # the process's 0.51 GiB; the download is the converted export (8.07 GB, its per-layer
    # embedding table in int8), packed to 7.45 GB. Apple (an M2, 2026-11-17): the converted Core AI
    # export (3.51 GB) and the tables (4.18 GB, the per-layer embeddings in int8), 7.73 GB with the tokenizer
    memory: {amd: 4.3, apple: 4.0}
    bytes: {amd: 7.45e9, apple: 7.7e9}
    features: [tools, thinking]
    amd_export: gemma4 --max-seq-len 4096 --q4
    about: "Google's Gemma 4 E4B, instruction tuned: larger and slower than E2B, its text model in 6 bit tables (vision and audio not converted)"
  Qwen3.5-4B:
    family: qwen3.5
    tag: 4b
    kind: chat
    from: hf:Qwen/Qwen3.5-4B
    license: {id: apache-2.0, url: "https://huggingface.co/Qwen/Qwen3.5-4B/blob/main/LICENSE", class: open}
    machine: 24
    memory: 4.2
    bytes: {amd: 4.46e9, apple: 9.3e9}
    features: [tools, thinking]
    amd_export: qwen35 --max-seq-len 4096 --q4
    about: "Qwen's Qwen3.5-4B: strong at code for its size, its text model in 8 bit tables (6 bit ones lose too much) read 8 tokens per call; the download has the vision part too, which is not converted"
  Qwen3.5-0.8B:
    family: qwen3.5
    tag: 0.8b
    kind: chat
    from: hf:Qwen/Qwen3.5-0.8B
    license: {id: apache-2.0, url: "https://huggingface.co/Qwen/Qwen3.5-0.8B/blob/main/LICENSE", class: open}
    # Apple (Core AI, an M1, 2026-11-15, docs/design/memory-and-power.md): 0.99 GiB on the Neural Engine
    # (the multi-token prediction layer's programs among it) and the process's 0.39 GiB, 1.5 GB;
    # with the whole program of short conversations (--tier 2048 on the M1) 1.84 + 0.31 GiB,
    # 2.3 GB: none on a machine of 8 GB (tier: none, docs/design/memory-and-power.md), from 16 GB on an M2 or later
    machine: 8
    memory: 1.5
    tier: none
    variants:
      16: {memory: {apple: 2.3, M1: 1.5}, tier: auto}
    bytes: {amd: 1.18e9, apple: 1.77e9}
    features: [tools, thinking]
    no_think: true
    amd_export: qwen35 --max-seq-len 4096 --q4 --mlp q6 --head q6 --verify 3
    about: "Qwen's smallest Qwen3.5, the 4B's structure in 0.8B: fast, but weak at facts; its text model in 8 bit tables, answering without thinking unless asked; the download has the vision part too, which is not converted"
  Qwen3.5-2B:
    family: qwen3.5
    tag: 2b
    kind: chat
    from: hf:Qwen/Qwen3.5-2B
    license: {id: apache-2.0, url: "https://huggingface.co/Qwen/Qwen3.5-2B/blob/main/LICENSE", class: open}
    # Apple (Core AI, an M1, 2026-11-15, docs/design/memory-and-power.md): 1.67 GiB on the Neural Engine and the process's
    # 0.39 GiB (no whole program: its weights twice are over what the two may hold): for 8 GB
    # too (docs/design/memory-and-power.md). Converting it the first time the process peaks at 6.0 GiB, which a machine
    # of 8 GB swaps for: there the programs converted already are to be fetched
    machine: 8
    memory: {amd: 2.4, apple: 2.2}
    bytes: {amd: 2.67e9, apple: 4.57e9}
    features: [tools, thinking]
    no_think: true
    amd_export: qwen35 --max-seq-len 4096 --q4 --mlp q6 --head q6 --verify 3
    about: "Qwen's Qwen3.5-2B, the 4B's structure in 2B: its text model in 6 bit tables (as good as 8 bit ones on it), answering without thinking unless asked; the download has the vision part too, which is not converted"
  Qwen2.5-Coder-7B-Instruct:
    # Qwen2 (qwen2: Qwen3's decoder with biases on q, k and v, no norms over the heads; its MLP
    # of 18944 in two pieces, under the Neural Engine's 16384). Apple: 4 bit tables over whole
    # rows chosen by GPTQ against the activations (codes, tools/ref/qwen2_gptq.py): KL 0.13 nats
    # against transformers' float32 where rounding gives 0.90 (lut8 0.0012; --format-for
    # down_proj=lut8 0.078 for 0.95 GB more). Tables of column blocks would be finer, but the
    # Neural Engine reads only a row's first (docs/design/llm-qwen.md). M1 (2026-11-16): 4.0 GB on
    # the Neural Engine and the process's 0.35 GB, 0.8 tokens/s: over the 2.8 GiB an M1 runs at
    # full speed (docs/design/apple-neural-engine.md), so not picked there; the M2 and later not measured. AMD: no export
    family: qwen2.5-coder
    tag: 7b
    kind: chat
    from: hf:Qwen/Qwen2.5-Coder-7B-Instruct@c03e6d358207e414f1eca0bb1891e29f1db0e242
    license: {id: apache-2.0, url: "https://huggingface.co/Qwen/Qwen2.5-Coder-7B-Instruct/blob/main/LICENSE", class: open}
    machine: 16
    memory: 4.4
    not_on: [M1]
    format: lut4
    codes: faace07a
    bytes: 15.2e9
    features: [tools]
    about: "Qwen's Qwen2.5-Coder-7B-Instruct: code generation, completion and repair, tool calls as JSON, in 4 bit tables chosen against its activations; no thinking; a context of 32768"
  gpt-oss-20b:
    family: gpt-oss
    tag: 20b
    kind: chat
    from: hf:openai/gpt-oss-20b
    license: {id: apache-2.0, url: "https://huggingface.co/openai/gpt-oss-20b/blob/main/LICENSE", class: open}
    # 16 GB: on AMD's NPU 16 of each layer's 32 experts in places (6.90 GiB pinned), the others
    # read from experts.bin with O_DIRECT when chosen, the decode step routed on the host so that
    # the next layer's experts are read ahead (docs/design/moe.md): 14.4 tokens/s, 3.5 % of the
    # choices read. On a Mac about 4 GB of the experts wired (experts.Placement), the others
    # mapped from the checkpoint. From 24 GB every expert in the NPU's memory (19.4 tokens/s on
    # AMD) and wired on a Mac
    machine: 16
    memory: {amd: 8.3, apple: 6.4}
    variants:
      24: {memory: {amd: 14.6, apple: 12.2}, amd_export: gptoss --max-seq-len 8192 --prefill-chunk 256}
    bytes: {amd: 11.79e9, apple: 14.4e9}
    features: [tools, thinking]
    amd_export: gptoss --max-seq-len 8192 --prefill-chunk 256 --expert-places 16 --host-route
    # the experts every kind of text runs (tools/moeusage, 19 categories of prompts in about 25
    # languages, 2026-11-20): in every category at least an even share (1/32) of their layer's
    # runs; 141 experts (1.9 GB) taking 31–41 % of the runs. Wired from the first run when the
    # experts do not all fit (experts.Placement)
    experts_core:
      - [1, 9, 16, 17, 23, 24]  # layer 0
      - [0, 10, 13, 16, 18, 28]  # layer 1
      - [0, 8, 21, 29, 31]  # layer 2
      - [0, 2, 7, 11, 19]  # layer 3
      - [6, 10, 12, 15, 20, 30]  # layer 4
      - [0, 6, 10, 14, 17, 24]  # layer 5
      - [3, 5, 10, 16, 31]  # layer 6
      - [1, 3, 4, 10, 13, 14, 17, 21, 24, 28, 30]  # layer 7
      - [0, 3, 17, 19, 24, 28, 31]  # layer 8
      - [8, 14, 19, 30]  # layer 9
      - [7, 10, 23, 26]  # layer 10
      - [9, 24, 30]  # layer 11
      - [1, 23, 25, 28]  # layer 12
      - [1, 4, 21, 24]  # layer 13
      - [1, 4, 9, 18, 24, 31]  # layer 14
      - [0, 3, 6, 9, 13, 19, 26, 28, 31]  # layer 15
      - [0, 11, 15, 17, 21, 24, 31]  # layer 16
      - [4, 5, 7, 8, 11, 13, 19, 25, 28]  # layer 17
      - [1, 9, 14, 20, 23, 27]  # layer 18
      - [7, 13, 19, 20, 29, 31]  # layer 19
      - [2, 6, 10, 11, 13, 16, 21]  # layer 20
      - [1, 2, 9, 18, 23, 27]  # layer 21
      - [0, 4, 11, 15, 22, 23]  # layer 22
      - [0, 22, 31]  # layer 23
    about: "OpenAI's gpt-oss-20b, a mixture of experts (21B, 3.6B active): on AMD's NPU, and on a Mac with Core AI its experts on the CPU (all wired into memory on 24 GB and more; on 16 GB about 4 GB of them, the ones every text runs and those the application runs most, fewer when the system runs short of memory), its experts in the checkpoint's own 4 bit MXFP4 (not rounded again), the attention in 8 bit tables and the output layer in 6 bit ones, with a scale a row; it always reasons first (the low effort with no_think)"
  Qwen3.6-35B-A3B:
    # a mixture of experts (qwen3_5_moe: 256 experts of 2048 x 512 a layer, 8 a token, and a
    # shared one; 35B, 3B active). Apple Core AI (docs/design/moe.md): the
    # experts on the CPU in 4 bit MXFP4 from a checkpoint derived from the release a layer at a
    # time (its bf16 experts are 64 GB of its 72: read over the network, 22 GB written, the
    # cache's derived/), mapped and none wired where they are over three quarters of the memory:
    # the page cache keeps what fits and a token's experts that are not there are read whole;
    # the token mixers, the routers and the shared experts on the Neural Engine.
    # An M3 of 16 GB (2026-11-20, 8 prompts of different fields, docs/design/moe.md):
    # 10.9-11.0 tokens/s, 2602 tokens of prompt in 21.5 s (its steps through one part at a time,
    # the experts read once); the Neural Engine 1.94 GB and the process 0.75 GB, 2.7 GB, beside
    # the page cache's share of the experts' 17.1 GB (6-7
    # GB there, which the system counts as free)
    family: qwen3.6
    tag: 35b-a3b
    kind: chat
    from: hf:Qwen/Qwen3.6-35B-A3B
    license: {id: apache-2.0, url: "https://huggingface.co/Qwen/Qwen3.6-35B-A3B/blob/main/LICENSE", class: open}
    # AMD (a Ryzen AI 9 365, 2026-11-17, docs/design/moe.md): 24,188 MiB of the NPU's (the
    # experts and head at 4 bits, the mixers at 8) and the process's 880 MiB at its peak while
    # it answers, 26.3 GB; exporting it the first time takes 29 minutes and peaks at 50 GB.
    # Below 48 GB its experts in places (--expert-places P, docs/design/moe.md): the others in
    # experts.bin (20.1 GB), copied into a place when chosen, read with O_DIRECT where the file
    # does not fit beside the places (measured with HWNPU_DEV=moe.direct=1, 2026-11-21, a
    # 1173-token prompt then 200 tokens, the peak of the NPU's buffers and the process's): 32
    # places 7.6 GiB, 33-38 % of the decode's choices copied in; 128 places 16.0 GiB, 6-7 %. The
    # logits the same to the bit as with every expert. Re-exported from main after the array
    # work of docs/design/amd.md, docs/design/amd-llm.md, docs/design/moe.md: every expert 8.8-8.9 tokens/s, 128 places 7.5-7.6, 32 places 5.8-6.0.
    # A layer's core over half its places is not kept in place on AMD (pool.go: with 32 places
    # it took most of them, 34.4 -> 36.7 % copied in)
    machine: 16
    memory: {amd: 8.2, apple: 2.7}
    variants:
