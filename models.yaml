    family: siglip2
    tag: base
    kind: label
    from: hf:google/siglip2-base-patch16-224
    exports:
      amd-xdna2:
        siglip2-base-patch16-224.amd-npu2: v2 sha256:a8c37876e4f9d31023cadb1a350194aa26ab7e84d60191859e5fe42205f8c957
    license: {id: apache-2.0, url: "https://huggingface.co/google/siglip2-base-patch16-224", class: open}
    machine: 8
    # M3: 0.45 GB of the process at most (embedding the 444 default labels) and 0.36 GB on the
    # Neural Engine (Core AI: 0.48)
    # apple: memwatch on an M2 (hwnpud and its engine, plus the Neural Engine), the larger of a
    # run from the h14g prebuilt programs and one compiled on the device (2026-11-28, PR #384)
    memory: {amd: 0.8, apple: 0.5}
    # AMD: the export for the NPU as the sources hold it (its files as they are)
    bytes: {amd: 0.82e9, apple: 1.54e9}
    disk: {apple: 0.77e9}
    about: "SigLIP 2 Base (Google, Apache-2.0): zero-shot labels in any language and embeddings of pictures (224 x 224) and texts in one space"
  siglip2-large-patch16-256:
    family: siglip2
    tag: large
    kind: label
    from: hf:google/siglip2-large-patch16-256
    exports:
      amd-xdna2:
        siglip2-large-patch16-256.amd-npu2: v2 sha256:a74788b0a3494e17d5cce383c047b62d657a01e428363251bcd9a8779c1ebd94
    license: {id: apache-2.0, url: "https://huggingface.co/google/siglip2-large-patch16-256", class: open}
    machine: 16
    # M3: 1.8 GB of the process and 1.24 GB on the Neural Engine (Core AI: 1.56)
    # apple: memwatch on an M2 (hwnpud and its engine, plus the Neural Engine), the larger of a
    # run from the h14g prebuilt programs and one compiled on the device (2026-11-28, PR #384)
    memory: {amd: 1.7, apple: 1.1}
    # AMD: the export for the NPU as the sources hold it (its files as they are)
    bytes: {amd: 1.87e9, apple: 3.57e9}
    disk: {apple: 1.78e9}
    about: "SigLIP 2 Large: the same at 256 x 256, closer labels and embeddings, about 3 times the work"
  # hwnpu-image segment: EfficientSAM (Meta's, Apache-2.0), the authors' ONNX exports of its
  # image encoder and its prompt's mask decoder; sha256 names each file. The encoder runs on
  # AMD's NPU from an export of tools/amd/iron_efficientsam.py made on the first run, on Apple's
  # Neural Engine and Intel's NPU converted from its ONNX file on the first run (M3: 0.4 s for S,
  # all on the Neural Engine; docs/design/vision-models.md), elsewhere on the CPU (ONNX Runtime, else hwnpu's
  # evaluator); the decoder on the host, per prompt
  EfficientSAM-Ti:
    family: efficientsam
    tag: ti
    kind: segment
    from: hf:yunyangx/EfficientSAM@1cf49585c39567bfc49e991ab8eb31f491ad4877
    exports:
      amd-xdna2:
        efficientsam-ti.amd-npu2: v1 sha256:5ec385fb8b2c18f1782d5001c66a21d4a2f062e669c8db458d63250d30d7485d
    license: {id: apache-2.0, url: "https://github.com/yformer/EfficientSAM/blob/main/LICENSE", class: open}
    sha256: {efficientsam_ti_encoder.onnx: 84ed466ffcc5c1f8d08409bc34a23bb364ab2c15e402cb12d4335a42be0e0951, efficientsam_ti_decoder.onnx: a62f8fa5ea080447c0689418d69e58f1e83e0b7adf9c142e2bd9bcc8045c0b11}
    device: {amd: npu}
    machine: 8
    # AMD: 118 MiB pinned on the NPU and 274 MiB of the process (the decoder in float64)
    # apple: memwatch on an M2 (hwnpud and its engine, plus the Neural Engine), the larger of a
    # run from the h14g prebuilt programs and one compiled on the device (2026-11-28, PR #384)
    memory: {amd: 0.4, apple: 0.5}
    bytes: 4.14e7
    disk: {amd: 0.03e9, apple: 0.01e9}
    about: "EfficientSAM-Ti: the mask of the thing a point or a box picks in a picture (Segment Anything's prompts); a ViT-Tiny at 1024 x 1024, 10M parameters"
  EfficientSAM-S:
    exports:
      amd-xdna2:
        efficientsam-s.amd-npu2: v1 sha256:4183513f65acfe022aad726b159a9824107b67f5181824d5977101e80f7c90ae
    like: EfficientSAM-Ti
    tag: s
    sha256: {efficientsam_s_encoder.onnx: 3eea4544db4647570ca5bea8ab6bbe057f2fc767ad089c14b8f67f482a2493ed, efficientsam_s_decoder.onnx: d40a537f617c8ced3b2034b6971bc16cc291c49d3d80f740a394cdb78f0e1d06}
    machine: 16
    # AMD: 158 MiB on the NPU and 267 MiB of the process
    # apple: memwatch on an M2 (hwnpud and its engine, plus the Neural Engine), the larger of a
    # run from the h14g prebuilt programs and one compiled on the device (2026-11-28, PR #384)
    memory: {amd: 0.45, apple: 0.5}
    bytes: 1.06e8
    disk: {amd: 0.07e9, apple: 0.05e9}
    about: "EfficientSAM-S: the same with a ViT-Small, closer masks, about 3 times the work"

categories:
  chat:
    aliases: [code, agent]
    about: chat and coding, with tool calls
    picks:
      - {machine: 8, model: LFM3-1.7B}
      - {machine: 16, model: gemma-4-E2B-it}
      - {machine: 24, model: gemma-4-E4B-it}
  vision:
    about: reads images (image generation is another use)
    picks:
      - {machine: 8, model: LFM3-VL-2B}
  audio:
    about: reads audio, questions about it (transcription is transcribe)
    picks:
      - {machine: 8, model: LFM3-Audio-2B}
      - {machine: 16, model: LFM3-Omni-2B}
  translate:
    aliases: [translation]
    about: translation
    picks:
      - {machine: 8, model: plamo-3-translate-0.8b}
      - {machine: 16, model: plamo-3-translate-8b}
  embedding:
    aliases: [embed, search]
    about: sentence embeddings, search
    picks:
      - {machine: 8, model: plamo-embedding-1b}
  transcribe:
    aliases: [transcription, asr]
    about: speech to text (hwnpu-audio transcribe)
    picks:
      - {machine: 8, model: whisper-large-v3-turbo}
  speech:
    aliases: [tts]
    about: text to speech (hwnpu-audio tts)
    picks:
      - {machine: 8, model: supertonic-3}
      - {machine: 16, model: LFM3-Audio-2B-TTS}
  decision:
    aliases: [systemone]
    about: typed questions about a state (hwnpu-chat systemone)
    picks:
      - {machine: 8, model: d1-2B}
  image:
    aliases: [generate]
    about: image generation (hwnpu-image generate)
    # FLUX.2 klein from 8 GB (4.9 GB on Apple at 1024 x 1024, 41 s on an M1; 3.9 GB on AMD):
    # Apache-2.0, safe by default, and edits too on AMD. Anima (nsfw) is not picked
    # even with +nsfw: named, they run (docs/design/image-models.md)
    picks:
      - {machine: 8, model: FLUX.2-klein-4B}
  depth:
    about: depth estimation (hwnpu-image depth)
    picks:
      - {machine: 8, model: DA3-SMALL}
      - {machine: 16, model: DA3-BASE}
      - {machine: 24, model: DA3MONO-LARGE}
  face-detect:
    about: face detection (hwnpu-image face-detect)
    picks:
      - {machine: 8, model: YuNet}
  pitch:
    aliases: [f0]
    about: the pitch (F0) of a voice or an instrument (hwnpu-audio pitch)
    picks:
      - {machine: 8, model: swift-f0}
  pose:
    aliases: [keypoints]
    about: people and their 17 keypoints in an image (hwnpu-image pose)
    picks:
      - {machine: 8, model: RTMO-s}
  detect:
    aliases: [object-detect, objects]
    about: the objects in an image, boxes and labels (hwnpu-image detect)
    picks:
      - {machine: 8, model: RTMDet-s}
      - {machine: 16, model: RTMDet-m}
  ocr:
    aliases: [text]
    about: the text in an image, its lines and boxes (hwnpu-image ocr)
    picks:
      - {machine: 8, model: PP-OCRv6-small}
  label:
    aliases: [labels, classify, zero-shot, image-embedding]
    about: labels of an image from any candidates, embeddings of images and texts (hwnpu-image label, embed)
    picks:
      - {machine: 8, model: siglip2-base-patch16-224}
      - {machine: 16, model: siglip2-large-patch16-256}
  segment:
    aliases: [sam, cutout-point]
    about: the mask of the thing a point or a box picks in a picture (hwnpu-image segment)
    picks:
      - {machine: 8, model: EfficientSAM-Ti}
      - {machine: 16, model: EfficientSAM-S}
  notes:
    aliases: [midi]
    about: the notes of music, as MIDI (hwnpu-audio notes)
    picks:
      - {machine: 8, model: basic-pitch}
  music:
    aliases: [music-generation]
    about: music from a text of its style (hwnpu-audio generate)
    picks:
      - {machine: 8, model: magenta-realtime-2-small}
  sfx:
    aliases: [sound-effects, sound-effect]
    about: sound effects from a text (hwnpu-audio generate)
    picks:
      - {machine: 8, model: MOSS-SoundEffect-v2.0-lut8}
      - {machine: 16, model: MOSS-SoundEffect-v2.0}
