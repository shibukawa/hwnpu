  Qwen3.5-0.8B:
    apple:
      version: 2
      # (version 2: the name became BonsaiAI, which the programs carry: ailower's producer, the metadata keys, tokenizer.tok's magic)
      code: [internal/llm/arch.go, internal/llm/convert.go, internal/llm/rotate.go, internal/llm/split.go, internal/llm/tables.go, internal/llm/blocks, internal/llm/paged, internal/chat/model.go, internal/llm/qwen35]
