      version: 4
      # (version 4: the name became BonsaiAI, tools/amd's files and tokenizer.tok's magic changed with it)
      # the tokenizer as its binary file (tokenizer.tok), which the runtime maps
      finish: [{tokenizer: [tokenizer.json]}, {remove: [tokenizer_config.json]}]
      script: iron_export_lm.py
      args: [lfm3vl, "{in}", "{out}", --max-seq-len, "12288", --q4]
      extra: *lm-extra
