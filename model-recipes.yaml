      # the tokenizer as its binary file (tokenizer.tok), which the runtime maps
      finish: [{tokenizer: [tokenizer.json]}, {remove: [tokenizer_config.json]}]
      script: iron_export_lm.py
      args: [gemma4, "{in}", "{out}", --max-seq-len, "4096", --q4]
      extra: *lm-extra
  gemma-4-E4B-it:
    apple:
      version: 2
      # (version 2: the name became BonsaiAI, which the programs carry: ailower's producer, the metadata keys, tokenizer.tok's magic)
      code: [internal/llm/arch.go, internal/llm/convert.go, internal/llm/rotate.go, internal/llm/split.go, internal/llm/tables.go, internal/llm/blocks, internal/llm/paged, internal/chat/model.go, internal/llm/gemma4]
