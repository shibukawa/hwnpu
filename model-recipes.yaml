# How bonsaiai-dev makes the models' conversions: what only the build needs, beside models.yaml
# (what a run needs). bonsaiai-dev models package and bonsaiai-dev prebuild read it, so that whoever
# runs them, on whatever machine, makes the same files (docs/model-recipes.md).
#
#   version     1
#   tools       the versions of the tools the conversions were checked with: coreai-build
#               (coreai-build --version, Xcode's Metal Toolchain). Another version stops the
#               build (--any-tools builds all the same, for a check of a new toolchain)
#   apple       what every model's Core AI exports are built with, unless its own says:
#     archs     the architectures of the Neural Engine the programs of the models that are
#               prebuilt (a model's prebuilt, below) are prebuilt for (coreai-build's names:
#               h13g M1, h14g M2, h15g M3, ...)
#     jobs      coreai-build's compiles at once (each takes one core and 1 to 3 GB; two at
#               once have left programs off the Neural Engine that pass alone)
#     prebuild  rules for programs of the exports, each for some architectures (arch: one or a
#               list; every one when left out), some exports (export: a pattern of the
#               export's name, * any characters; every one when left out) and some programs
#               (programs: patterns of the programs' names without .aimodel):
#                 do: device   not prebuilt: the device's compiler compiles it at its first
#                              run (it takes programs coreai-build leaves off the Neural Engine)
#                 why          what coreai-build did (its message in os_log), and
#                 checked      the day it was seen (YYYY-MM-DD), both asked for
#     rewrite   how some architectures' programs write an operation some Neural Engines do not
#               run (arch as above; op, as: one of its ways, the default first):
#                 sin: series  range reduction and a series of products and sums
#                      native  the operation
#               with why and checked as above. It is chosen at the conversion, so the chips of
#               other rewrites take an export of their own, the rewrite in its name
#               (bonsaiai-dac-r3-fp16-sin-native.coreai); a chip no rule names takes the default.
#               A run takes its own chip's (BONSAIAI_DEV=rewrite=sin:series over it, to compare)
#     code      the Go packages (directories of the module, or one .go file of one) every Core AI
#               conversion writes its programs with: MIL, its lowering, the weights' writing
#   amd         what every model's exports for AMD's NPU are made with, unless its own says:
#     generations  the generations of the NPU they are made for: xdna1 (Phoenix, Hawk Point:
#               IRON's npu1), xdna2 (Strix, Krackan: npu2). Each goes as its own target
#               (amd-xdna2); bonsaiai runs amd-xdna2's alone yet, so xdna1's are not made
#     extra     GEN: arguments after every script's own for that generation
#   models      MODEL (a model of models.yaml): {apple: ..., amd: ...}. apple as above, its rules
#               after those of apple. A build that fails on a program no rule names stops, and
#               says the rule that would leave it to the device. A model's apple also has:
#     prebuilt  true: its exports' programs are prebuilt for archs when the build names no
#               architecture (bonsaiai-dev models package MODEL, bonsaiai-dev prebuild EXPORT) and
#               put in the sources, where a Mac of the chip takes them at its first run. The
#               image generators alone: the device compiles a program of theirs in minutes to
#               hours. Another model's programs are small, and a Mac loads them slower from
#               prebuilt programs than it compiles them (LFM3-1.7B 2 min 17 s on the device, 8
#               min 12 s prebuilt; Whisper 53 s, 5 min 27 s: docs/known-issues.md 9,
#               2026-11-22). A build that names architectures (MODEL/coreai-ARCH, -arch)
#               compiles any model's all the same, to measure it again
#     version   the version of what its Core AI conversion makes (the sources keep its exports
#               as vN: converted/MODEL/coreai/EXPORT/v1; an export made here of another version
#               is made again). Raise it whenever its convert or its code changes what it
#               makes: internal/recipe/testdata/apple-versions.txt holds what each version is,
#               and its test fails on a change under the same version. 1: the exports of
#               before (2026-11-24), the same bytes, their names kept
#     code      the Go packages that write its programs, after apple's code (a change of them
#               is a change of the version, as amd's tools); !FILE leaves out a file of them
#               only a run reads (experts' host.go, lfm3vl's preprocess.go)
#     finish    what the build does to its Core AI exports once converted, as amd's finish
#               (their tokenizer files made binary); a model without one leaves them as they are
#     convert   the values its conversion is made with, by their names in its code
#               (text_group, qchunk): what the code took as constants before. What a run reads
#               too stays in models.yaml (npu.apple's sizes and formats)
#   amd:
#     script    the script of tools/amd that makes the export
#     args      its arguments; placeholders, each a whole argument, are put in by the code that
#               runs it: {in} what it prepared (the checkpoint's folder, the ONNX file), {out}
#               the export's folder, {sizes} the sizes (models.yaml npu.amd, or the code's),
#               {size}, {outputs} (the ONNX outputs the code chose), {text} (the text
#               encoder's format), {dit} (the DiT's file)
#     variants  GB: args on a machine of that much memory or more (a variant of models.yaml)
#     version   the version of what it makes (the sources keep it as vN; models.yaml's targets
#               do not give amd-xdna2's then). Raise it whenever the recipe changes:
#               internal/recipe/testdata/amd-versions.txt holds what each version is, and its
#               test fails on a recipe changed under the same version. 1: the exports of
#               models.yaml's amd_export and bonsaiai's code before (2026-11-23), copied as v1
#     generations, extra  as amd's, over them (extra: after them)
#     skip      generations the export is not made for: {generation, why, checked}
#     finish    what the build does to the export once its script has made it, in order, each
#               step one of (internal/finish):
#                 tokenizer: [FILES]  the tokenizer files of the export (paths in it) written
#                             as their binary files (tokenizer.tok), which the runtime maps,
#                             and removed. An export that holds a tokenizer file its finish
#                             does not name stops the build. A change of it is one of the
#                             recipe (raise version)
#                 remove: [FILES]     files of the export the runtime does not read, removed
#                             (tokenizer_config.json, after the tokenizer step that may read it)
#   For iron_export_lm.py the args but {in} and {out} name the export (-q4, -p16) and key it in
#   the sources; for the others the code's version (ExportVersion) keys it, and for
#   iron_flux2klein.py, iron_flux3klein.py and iron_moss_sfx.py the args too
version: 1

tools:
  coreai-build: 3605.6.3

apple:
  archs: [h13g, h14g, h15g]
  jobs: 2
  # what every Core AI conversion writes its programs with: MIL, its lowering to Core AI's
  # bytecode, and the writing of the weights and the parts
  code: [internal/mlpackage, internal/coreai/ailower, internal/coreai/mlirbc, internal/llm/manifest.go, internal/llm/convertai.go, internal/llm/weights.go]

amd:
  generations: [xdna2]
  extra:
    # every script takes --device (npu2 by default)
    xdna1: [--device, npu1]

models:
  FLUX.2-klein-4B:
    amd:
      version: 3
      # (version 3: the name became BonsaiAI, tools/amd's files and tokenizer.tok's magic changed with it)
      # the tokenizer as its binary file (tokenizer.tok), which the runtime maps
      finish: [{tokenizer: [text/tokenizer.json]}]
      # one export of every size of models.yaml npu.amd
      script: iron_flux2klein.py
      args: ["{in}", "{out}", --size, "{sizes}"]
    apple:
      version: 5
      # (version 5: the name became BonsaiAI, which the programs carry: ailower's producer, the metadata keys, tokenizer.tok's magic)
      prebuilt: true
      # the tokenizer as its binary file (tokenizer.tok), which the runtime maps (version 4; the
      # programs as version 3's, so its prebuilt programs are the same)
      finish: [{tokenizer: [text/tokenizer.json]}]
      code: [internal/imagegen/flux2klein, internal/imagegen/flux2klein/mil, internal/imagegen/fluxvae, internal/imagegen/anima/mil, internal/imagegen/milpart]
      # a program: 3 of Qwen3's layers (0.3 GB at 8 bits), 2 double blocks (0.5 GB), 2 single
      # blocks (0.26 GB); the formats are models.yaml's npu.apple (a run reads them).
      # single_group 2: with 5 a program, coreai-build left the edit at 1024 x 1024 from three
      # references of 512 (7680 rows) off the Neural Engine on h13g and h14g ("RegAlloc: failed to
      # allocate tensors with fixed L2 hint"), and h13g every size of 1152 x 768 and up (the M1
      # then compiled the single blocks on the device, 50 min to 2.5 h each). Offline, that edit
      # passed with 2 a program on h13g (3 failed) and 3 on h14g (4 failed); 1152 x 768 and the edit
      # from one reference of 1024 passed with 3 on h13g (2026-11-24)
      convert:
        text_group: 3
        double_group: 2
        single_group: 2
      jobs: 3
  MOSS-SoundEffect-v2.0: &moss
    amd:
      # 3: no tokenizer/tokenizer_config.json (iron_moss_sfx.py: internal/sfx reads none)
      version: 4
      # (version 4: the name became BonsaiAI, tools/amd's files and tokenizer.tok's magic changed with it)
      # the tokenizer as its binary file (tokenizer.tok), which the runtime maps
      finish: [{tokenizer: [tokenizer/tokenizer.json]}]
      # an export of each text encoder's format (sfx.Formats: fp16 on 16 GB, lut8 on 8 GB)
      script: iron_moss_sfx.py
      args: ["{in}", "{out}", --text, "{text}"]
    apple:
      version: 2
      # (version 2: the name became BonsaiAI, which the programs carry: ailower's producer, the metadata keys, tokenizer.tok's magic)
      code: [internal/sfx]
      rewrite:
        # coreai-build, each of the five decoder stages: with sin itself, h13g, h14g and h14c
        # split the stage in 8 or 9 regions of the Neural Engine (sin off it between them),
        # h15g/c, h16g/s/c and h17g/s/c/d keep it in one; the series is one region on all.
        # h15s/m/d and h17p: coreai-build crashes on them, not checked
        - arch: [h15g, h15c, h16g, h16s, h16c, h17g, h17s, h17c, h17d]
          op: sin
          as: native
          why: "one Neural Engine region a stage offline with sin (h13g, h14g, h14c: 8 to 9, sin off it); the M3 took this export and made its sound"
          checked: 2026-11-23
      prebuild:
        - programs: ["*"]
          do: device
          why: "audio prebuilts were slower or failed on the M1 (Whisper 2:48 to 4:08 first load, Magenta 'bad program image', MOSS 'Request cancelled'), and a bad one does not fall back"
          checked: 2026-11-19
  MOSS-SoundEffect-v2.0-lut8: *moss

  # the exports for AMD's NPU alone

  # language models (and d1's decision models): tools/amd/iron_export_lm.py ARCH CHECKPOINT OUT
  # OPTIONS; the options name the export (-q4, -q6, -p16) and key it in the sources
  LFM3-1.7B:
    apple:
      version: 2
      # (version 2: the name became BonsaiAI, which the programs carry: ailower's producer, the metadata keys, tokenizer.tok's magic)
      code: [internal/llm/arch.go, internal/llm/convert.go, internal/llm/rotate.go, internal/llm/split.go, internal/llm/tables.go, internal/llm/blocks, internal/llm/paged, internal/chat/model.go, internal/llm/lfm3]
    amd:
      # 3: tokenizer_config.json removed (the binary tokenizer holds what bonsaiai reads of it)
      version: 4
      # (version 4: the name became BonsaiAI, tools/amd's files and tokenizer.tok's magic changed with it)
      # the tokenizer as its binary file (tokenizer.tok), which the runtime maps
      finish: [{tokenizer: [tokenizer.json]}, {remove: [tokenizer_config.json]}]
      script: iron_export_lm.py
      args: [lfm3, "{in}", "{out}", --max-seq-len, "12288", --q4]
      extra: &lm-extra
        # on xdna1: its 4 columns, an xclbin a step (it has no full ELF)
        xdna1: [--cols, "4"]
  LFM3-VL-2B:
    apple:
      version: 2
      # (version 2: the name became BonsaiAI, which the programs carry: ailower's producer, the metadata keys, tokenizer.tok's magic)
      code: [internal/llm/arch.go, internal/llm/convert.go, internal/llm/rotate.go, internal/llm/split.go, internal/llm/tables.go, internal/llm/blocks, internal/llm/paged, internal/chat/model.go, internal/llm/lfm3, internal/llm/lfm3vl, "!internal/llm/lfm3vl/preprocess.go"]
    amd:
