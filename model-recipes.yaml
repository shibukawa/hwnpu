      code: [internal/llm/arch.go, internal/llm/convert.go, internal/llm/rotate.go, internal/llm/split.go, internal/llm/tables.go, internal/llm/blocks, internal/llm/paged, internal/chat/model.go, internal/llm/lfm3, internal/llm/lfm3vl, "!internal/llm/lfm3vl/preprocess.go", internal/llm/lfm3audio]
    amd:
      # 3: tokenizer_config.json removed (the binary tokenizer holds what bonsaiai reads of it)
      version: 4
      # (version 4: the name became BonsaiAI, tools/amd's files and tokenizer.tok's magic changed with it)
      # the tokenizer as its binary file (tokenizer.tok), which the runtime maps
      finish: [{tokenizer: [tokenizer.json]}, {remove: [tokenizer_config.json]}]
      script: iron_export_lm.py
      args: [lfm3omni, "{in}", "{out}", --max-seq-len, "12288", --q4]
      extra: *lm-extra
  gemma-4-E2B-it:
    apple:
      version: 2
      # (version 2: the name became BonsaiAI, which the programs carry: ailower's producer, the metadata keys, tokenizer.tok's magic)
      code: [internal/llm/arch.go, internal/llm/convert.go, internal/llm/rotate.go, internal/llm/split.go, internal/llm/tables.go, internal/llm/blocks, internal/llm/paged, internal/chat/model.go, internal/llm/gemma4]
    amd:
