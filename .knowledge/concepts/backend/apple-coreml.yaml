id: backend:apple-coreml
type: backend
title: Appleバックエンド (Core ML)
summary: purego/objc で Core ML を呼ぶ。ANE を直接は使えないが、GPU を除外し、ANE 配置を実行前に検証する。
lifecycle: accepted
scope: {backend: coreml, os: darwin}
constraints:
  - computeUnits の既定は MLComputeUnitsCPUAndNeuralEngine (macOS 13以降) とし GPU を使わない
  - 配置検証は MLComputePlan (macOS 14.4以降、ML Program 形式) を使う
capabilities:
  inference: {about: capability:coreml/inference, state: implemented, verified_by: [m1-infer]}
  placement-verify: {about: capability:coreml/placement-verify, state: implemented, verified_by: [m1-strict]}
  power-control: {about: capability:coreml/power-control, state: not_applicable}
  power-meter: {about: capability:coreml/power-meter, state: absent}
facts:
  dev_machine: 開発機は darwin/arm64 (Go 1.27)
  observations:
    small_models_on_cpu: fp16 でも小さなモデルは CPU に置かれる。linear (64,512)->512 は ANE、(32,256)->256 以下は CPU、1x1 conv (最大 256ch 32x32) は CPU (macOS 27.0.1)
    model_size_limit: >-
      ANE に載るのはモデル 1 つあたり保存された重みで 1 GiB 未満 (M3 16GB、macOS 27.0.1、cmd/npuprobe limit)。
      境目は fp16 0.91/1.02、int8 0.96/1.02、lut4 0.99/1.02 GiB (載る/載らない) で形式によらない。超えると全演算が CPU。
      上限はモデルごとで、0.91 GiB を 3 つ同時に読み込んでも全部 ANE で速度も同じ。大きなネットワークは層で分割すれば載る (layer_split)。
      CPU に落ちた lut4 は 1.1 GiB で 1 呼び出し 5 秒以上と極端に遅い (表を展開した fp16 がメモリを圧迫)
    layer_split: >-
      1 GiB の上限は層ごとにモデルを分けて超えられ、劣化も遅延もほぼない (M3 16GB、macOS 27.0.1、npuprobe split、lut4 64 層 1.81 GiB)。
      2 分割 (32 層 0.91 GiB x2) も 4 分割 (16 層 0.45 GiB x4) も全部分が ANE に載り、1 トークン 30.0/30.2 ms、重み 65/64 GB/s で、
      16 層単体 (7.5 ms、65 GB/s) と同じ帯域。全部分を続けて動かす時間は各部分の単独時間の合計 (30.5/30.4 ms) 以下で、切り替えの費用はない (重みの読み直しなし)。
      前の部分の出力バッファをそのまま次の入力に Bind すればよく、コピーも要らない。
      GPU 参照との誤差は 32 層目 3.32%、64 層目 4.91% で 2 分割と 4 分割で全桁一致し、境目による劣化はゼロ (誤差は ANE の演算誤差が深さで積もったもの)。
      コンパイルは部分が小さいほど合計が短い (16 層 1 つ 8 秒、32 層 1 つ 16〜30 秒)
    layer_split_m4: >-
      M4 で 3.6 GiB のモデルを 2/4/8/16 分割して 58.3/58.8/59.4/60.6 ms/token。誤差はなく、分割数を増やすほど消費メモリが大きく減った
      (2026-10-29 利用者の計測。メモリの指標と数値、機種のメモリ量と OS はまだ記録していない)。
      境目 1 つの費用は約 0.16 ms (2→16 分割で境目 14 個増えて 2.3 ms、4%)。M3 の約 0.1 ms と同程度。
      2 分割 (1 部分 1.8 GiB) が動いたので、M4 の 1 モデルあたりの上限は 1.8 GiB 以上と考えられる (全部分が ANE に載った前提での推定)
    multifunction_limit: >-
      1 GiB の上限は読み込む関数ごとではなく、パッケージ全体 (共有の weight.bin) で数えられる。lut4 64 層 1.81 GiB を 1 つのパッケージの 2 関数
      (32 層ずつ) にして MLModelConfiguration.functionName で 1 つずつ読み込むと、どちらの関数も全演算 CPU (513/514 演算) で 1 トークン 12.5 秒、
      GPU との誤差 8.2%/10.9%、プロセスの最大 RSS 5.26 GiB。同じ分け方を別パッケージにすると全部 ANE で 30.6 ms、最大 RSS 1.03 GiB
      (M3、macOS 27.0.1、npuprobe split -layout functions,files、2026-10-29)。4 関数 (0.45 GiB ずつ) でも全部 CPU。大きなモデルを分けるときはパーツごとに別のパッケージにする
    split_memory_m3: >-
      別パッケージの分割では、部分を動かすプロセスの最大 RSS がおよそ 1 部分の重みの大きさになる (lut4 1.81 GiB の 2 分割で 1.03 GiB、4 分割で 0.55 GiB。
      速さは 30.6 / 31.3 ms/token)。Core ML と ANE のシステム側のプロセスの分は含まない。読み込みの間に 1 部分ずつ重みを読む山と考えられる (推定)
    lfm3_generation: >-
      LFM3-1.7B lut4 (kmeans-minmax、0.81 GiB、seq 128) を 1/2/4/8 パッケージに分けて hwnpu-generate で生成。全部分 ANE、34.2/34.2/36.7/33.6 ms/token で
      分割による差は誤差の範囲。プロセスの最大 RSS 1.01/0.93/0.72/0.84 GiB (トークナイザーやロジットのバッファなどモデル以外の分を含む)。
      キャッシュからの読み込みは 0.8/1.1/4.0/23.7 秒 (8 分割だけ遅い理由は未調査)。KV キャッシュなしで 128 トークンの窓を毎回動かしている (2026-10-29)
    kv_cache_host: >-
      KV キャッシュをホストのバッファとしてプログラムの入出力に渡す方式は ANE に載る (MLState は使っていない)。LFM3-1.7B lut4 2 分割、1 回 1 トークンで
      キャッシュ 256/1024/4096 トークンのとき 16.8/20.6/37.6 ms/token、全演算 ANE。遅さはキャッシュの使用量ではなく容量 (固定の形) に比例し、
      1000 トークン分の容量につき約 5.4 ms。4096 で増えた分は KV の読み出しに直すと 4.6 GB/s しかなく、Core ML が入力の配列を毎回コピーしている
      可能性がある (推定)。1 回 8 トークンの版は生成 23.3 ms で、23 トークンのプロンプトの読み込みは速くならなかった (577 ms 対 551 ms)。
      キャッシュ 4096 で日本語の文書を 1500 トークン、26.7 tokens/s で生成できた (M3、macOS 27.0.1、2026-10-29)
    zero_copy: MLMultiArray initWithDataPointer と outputBackings で入出力ともコピーなし
    loader_names: MIL の値の名前に "." が入っていると Core ML のローダが segfault する (英数字と _ だけにする)
    gather_on_cpu: gather (埋め込みの表引き) は大きさによらず CPU に置かれる。linear は 1 演算だけのグラフだと CPU、複数演算で 2048 幅なら ANE
    lut_formats: >-
      constexpr_lut_to_dense は出力チャンネル 16 行ごとの表 (per_grouped_channel) なら ANE。列方向にもブロック化した表 (16x64) は全演算が CPU に落ちる。
      constexpr_blockwise_shift_scale の int4 は行ごとのスケールだけ ANE、入力 32 個や 128 個ごとのブロック (Q4_0 相当) は CPU
    matmul_error_floor: >-
      ANE の linear は出力に約 2.5e-4 の絶対誤差の床がある (2048 長の内積、重み rms 0.02。入力 rms 1 で相対 0.03%、rms 0.03 で 0.95%、同じ絶対誤差)。
      入力を 2^k 倍して重みを 1/2^k 倍しても積が変わらないので効かない。出力が小さい射影 (LFM3 の out_proj/o_proj/w2、出力 rms 0.008) は重み自体を 64 倍し、
      続くサンドイッチ正規化の中で正確な要素積で戻す (PostScale)。これで層ごとの誤差が 6〜12% から 1.4〜2.7% になった
    rmsnorm: MIL に rms_norm はなく mul/reduce_mean/rsqrt/mul で組む。小さい値の二乗が fp16 の非正規化数に落ちると精度を失う (1/16 に縮めると層誤差 9% → 6%)。要素演算の精度は十分で、床があるのは行列積
    fp16_depthwise_conv: 深さ方向 conv (groups=channels) は ANE で正確。conv 演算、タップ展開 (slice/mul/add)、転置の有無で誤差は同一
  limits:
    - ANE のみの指定はできない
    - MLComputePlan は推定で、実行時の配置を保証しない
    - ANE は fp16 と固定形状が前提。fp32 や動的形状は CPU に回りやすい
verification:
  m1-infer: {state: passed, method: integration, test: TestFP16RunsOnNeuralEngine, authority: observed, evidence: {path: coreml_darwin_test.go, locator: TestFP16RunsOnNeuralEngine}, basis: [{path: coreml_darwin_test.go, input_hash: 506ade11e6a098ad47f75485625fa62bd0b69857b977dc66fe34e0b2fe78ebe6}]}
  m1-strict: {state: passed, method: integration, test: TestStrictRejectsFP32, authority: observed, evidence: {path: coreml_darwin_test.go, locator: TestStrictRejectsFP32}, basis: [{path: coreml_darwin_test.go, input_hash: 506ade11e6a098ad47f75485625fa62bd0b69857b977dc66fe34e0b2fe78ebe6}]}
  zero-copy: {state: passed, method: integration, test: TestOutputBackingZeroCopy, authority: observed, evidence: {path: internal/backend/coreml/zerocopy_darwin_test.go, locator: TestOutputBackingZeroCopy}, basis: [{path: internal/backend/coreml/zerocopy_darwin_test.go, input_hash: 70a16a3dd6fb0a5655137ade24571e2d18f152a550d9ee4094ec28375eada5eb}]}
  layer-split: {state: passed, method: manual, test: npuprobe split, authority: observed, scope: {backend: coreml}, evidence: {path: npuprobe-m3-split.md, locator: A model split into parts run one after another}}
open_questions:
  size-limit-other-chips:
    text: 1 GiB の上限は M4 以降やメモリ量で変わるか
    state: open
    resolution: 2026-10-29 一部判明。M4 では 1.8 GiB の部分が動いた (layer_split_m4)。正確な境目は npuprobe limit の結果待ち
  split-memory:
    text: 分割数を増やすと消費メモリが減るのはなぜか。常駐の量か、コンパイル時の山か。Core ML の ANE コンパイラは別プロセス (ANECompilerService) で動くので、そちらの量も含むか
    state: open
    resolution: 2026-10-29 一部判明。プロセスの最大 RSS はおよそ 1 部分の重みの大きさ (split_memory_m3)。システム側のプロセスの量はまだ測っていない
  mlstate:
    text: Core ML の状態 (MLState、read_state/coreml_update_state) で KV キャッシュを持つと、入力のコピー (と推定される容量に比例する費用) がなくなるか。状態の演算は ANE に載るか
    state: open
  multifunction:
    text: 1 つのパッケージの関数を 1 つずつ読み込めば、ファイルを分けずに 1 GiB を超えられるか
    state: answered
    resolution: 2026-10-29 できない。上限はパッケージ全体で数えられ、全関数が CPU に落ちる (multifunction_limit)
  block-callback:
    text: MLComputePlan の完了ハンドラ (ブロック) を purego/objc で1つ作って使い回せるか
    state: answered
    resolution: 2026-10-27 objc.NewBlock で受けられることを確認。CGO_ENABLED=0 でも別スレッドからのコールバックが動いた
relations:
  - relation: informs
    to: decision:coreml-layer-split
  - relation: verified_by_milestone
    to: milestone:m5-llm-convert
  - relation: implements
    to: requirement:npu-only-execution
  - relation: implements
    to: requirement:model-execution-api
