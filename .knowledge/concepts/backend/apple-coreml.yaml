    text: MLComputePlan の完了ハンドラ (ブロック) を purego/objc で1つ作って使い回せるか
    state: answered
    resolution: 2026-10-27 objc.NewBlock で受けられることを確認。CGO_ENABLED=0 でも別スレッドからのコールバックが動いた
