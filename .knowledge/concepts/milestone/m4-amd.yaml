id: milestone:m4-amd
type: milestone
title: M4 AMD バックエンド (amdxdna)
summary: Linux の amdxdna ドライバを ioctl で直接呼び、IRON / mlir-aie の xclbin を KernelRunner で実行する。
lifecycle: accepted
scope: {milestone: m4, backend: xdna}
constraints:
  - 開発機に Ryzen AI 機が無いので、カーネルと XRT のソースから仕様を読み取り、C ヘッダ由来の基準値と Go 製の偽ドライバで検証する
acceptance:
  abi:
    text: ioctl 番号と UAPI の構造体、xclbin の構造体、ERT ヘッダのビット配置が C ヘッダから求めた値と一致する
    scope: {milestone: m4}
    verified_by: [abi-xdna, abi-ert, abi-xclbin]
  kernel-run:
    text: xclbin を読み込んでハードウェアコンテキストと CU を設定し、ERT_START_CU を投入して syncobj で完了を待ち、結果が正しい
    scope: {milestone: m4}
    verified_by: [run-sim, run-public, run-report, run-hw]
  errors:
    text: 引数の不足・型違い、コマンドのエラー状態、context の取り消し、PDI の無い xclbin を正しく報告する
    scope: {milestone: m4}
    verified_by: [errors-sim]
  power:
    text: 電力ポリシーが QoS 優先度に写像され、NPU の電力センサーから電力量を積分できる
    scope: {milestone: m4}
    verified_by: [power-sim]
