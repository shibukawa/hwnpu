open_questions:
  hardware-check:
    text: Ryzen AI の Linux 機で、実ドライバと IRON の passthrough 設計を相手に動くか
    state: open
    resolution: go run ./cmd/report -xclbin final.xclbin -insts insts.bin を実機で実行してもらう
  real-xclbin:
    text: 本物の xclbin (aiecc / xclbinutil が生成したもの) をパーサが正しく読めるか
    state: open
    resolution: mlir-aie wheel を導入してビルドする実験はこの環境の権限で拒否された。実機確認の際に同時に確かめる
  elf-flow:
    text: ELF 経路 (ERT_START_NPU*) と UMQ 世代、ヒープ拡張への対応
    state: deferred
    resolution: xclbin 経路が実機で動いたあとに判断する
facts:
  decisions:
    power-mode:
      choice: デバイス全体の電力モード (SET_STATE、root 専用) は変更せず、コンテキストの QoS 優先度だけを使う
      reason: 一般ユーザーで使え、他のプロセスに影響しない
    energy:
      choice: 瞬間値のセンサーを PowerSample の呼び出し間で台形積分して EnergyJ を作る
      reason: 公開 API を積算電力量の形に揃えるため
    package-name: バックエンドは internal/backend/amd (internal/xdna との名前の衝突を避けた)
  fixes:
    - ioctl の EAGAIN を再試行していた (amdxdna はヒープ未準備を EAGAIN で返すため無限ループの恐れ)。EINTR のみに
    - 構造体内のポインタを整数で持っていた (スタック移動で古いアドレスが渡る恐れ)。unsafe.Pointer 型に
history:
  completed:
    summary: 2026-10-28 偽のドライバ相手に受け入れテストに合格。実機と本物の xclbin では未検証。詳細は docs/design.md 16.5
