id: milestone:m3-power
type: milestone
title: M3 電力ポリシー、電力量の計測、コンパイルキャッシュ
summary: 共通の PowerPolicy、積算電力量の PowerSample、WithCacheDir によるコンパイルキャッシュを Intel と Apple に実装する。
lifecycle: accepted
scope: {milestone: m3}
constraints:
  - AMD バックエンドは未実装のため対象外
  - Intel は偽のドライバで検証する
acceptance:
  policy-mapping:
    text: PowerLow/Balanced/Performance が Intel のキュー優先度・ワークロード種別・ターボに写像される。電力の設定がない Core ML では CapPowerControl を持たない
    scope: {milestone: m3}
    verified_by: [policy-mock, coreml-no-power]
  energy-sample:
    text: 電力量を読めるデバイスでは PowerSample が積算ジュールと対象範囲 (npu / package) を返し、読めないデバイスでは ErrUnsupported を返す
    scope: {milestone: m3}
    verified_by: [rapl-unit, coreml-no-power]
  cache:
    text: WithCacheDir の 2 回目の読み込みはコンパイルを省略し、モデル・ビルドフラグ・版が変わると作り直す
    scope: {milestone: m3}
    verified_by: [cache-mock, cache-coreml]
