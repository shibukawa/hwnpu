open_questions:
  policy-effect:
    text: Intel 実機で電力ポリシーの違いが実際の電力に表れるか
    state: open
    resolution: cmd/report の -power low と -power performance を実機で比べる
  npu-only-energy:
    text: NPU 単体の電力を読む手段 (Intel、Windows、Apple)
    state: deferred
    resolution: 現状は Linux の RAPL (CPU パッケージ全体) のみ。手段が見つかったら ScopeNPU として追加する
facts:
  decisions:
    energy-api:
      choice: 瞬間値ではなく積算電力量 (ジュール) を返し、平均電力は 2 回の差から求める
      reason: RAPL は積算カウンタで、短い推論の電力も区間で正しく求められる
    queue-ordinal-fix: コマンドキューとリストを計算用グループに作るよう修正した (以前は 0 番決め打ち)
  observations:
    coreml_cache: キャッシュありの Core ML コンパイルは 158 ms から 27 ms
history:
  completed:
    summary: 2026-10-28 受け入れテストに合格 (Intel は偽のドライバ、Apple は実機)。詳細は docs/design.md 16.4
relations:
  - relation: delivers
    to: requirement:power-control
  - relation: delivers
    to: requirement:power-metering
  - relation: delivers
    to: requirement:compile-cache
