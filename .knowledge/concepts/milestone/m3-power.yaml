  rapl-unit: {state: passed, method: unit, test: TestRAPL, authority: observed, scope: {milestone: m3}, evidence: {path: internal/power/rapl_test.go, locator: TestRAPL}, basis: [{path: internal/power/rapl_test.go, input_hash: 60e929332f169777ed07cb1fb565d916b6d1db9a5ac851b5a242c15124621b09}]}
