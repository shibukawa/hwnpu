    - https://arxiv.org/abs/2405.12981
    - https://arxiv.org/abs/2405.05254
    - https://arxiv.org/abs/2502.07864
    - https://arxiv.org/abs/2402.02750
    - https://arxiv.org/abs/2401.18079
    - https://arxiv.org/abs/2404.14469
    - https://arxiv.org/abs/2412.19442
    - https://pytorch.org/blog/flash-decoding/
    - https://github.com/ggml-org/llama.cpp/pull/13194
    - https://huggingface.co/blog/mistral-coreml
    - https://developer.apple.com/forums/thread/783612
